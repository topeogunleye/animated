<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangman in 3D: step by step</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#18212b; --muted:#5b6876; --line:#d5dbe3;
  --hl-bg:#fff3bf; --hl-bar:#d99a00; --stage:#eef1f5;
  --plate:#c3ccd7; --accent:#e8a900;
  --btn:#ffffff; --btnHover:#eef1f5;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318; --panel:#171c23; --ink:#e8edf3; --muted:#9aa7b6; --line:#2c3440;
    --hl-bg:#4a3d0a; --hl-bar:#ffc400; --stage:#141a21;
    --plate:#3a4452; --accent:#ffc400;
    --btn:#1d2430; --btnHover:#27303b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#171c23; --ink:#e8edf3; --muted:#9aa7b6; --line:#2c3440;
  --hl-bg:#4a3d0a; --hl-bar:#ffc400; --stage:#141a21;
  --plate:#3a4452; --accent:#ffc400;
  --btn:#1d2430; --btnHover:#27303b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:1120px;margin:0 auto;padding:12px 14px 22px}
h1{font-size:1.15rem;margin:4px 0 12px;font-weight:650}
.wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start;transition:grid-template-columns 180ms ease}
.wrap.code-hidden{grid-template-columns:minmax(0,1fr)}
.wrap.code-hidden .code-pane{display:none}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}}
.stagebox{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:4/3;min-height:260px;max-height:64vh;width:100%}
#cv{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
#cv:active{cursor:grabbing}
.hint{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--muted);pointer-events:none}
.tag{position:absolute;top:8px;left:10px;right:10px;width:max-content;max-width:calc(100% - 20px);font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--panel);border:1px solid var(--line);padding:2px 9px;border-radius:999px}
.err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--ink);background:var(--stage)}
.err[hidden]{display:none}
#caption{margin:12px 2px 10px;min-height:3em;font-size:1rem}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit;font-size:.9rem;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-height:36px}
button{cursor:pointer;min-width:64px}
button:hover:not(:disabled){background:var(--btnHover)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn-tour{background:var(--accent);color:#111;font-weight:700;border:1px solid rgba(0,0,0,0.18);display:inline-flex;align-items:center;gap:6px;padding:6px 14px}
.btn-tour:hover:not(:disabled){filter:brightness(1.08)}
.btn-tour.playing{background:var(--btn);color:var(--ink);border-color:var(--accent)}
.tour-icon{font-size:0.95em}
.btn-mute{min-width:40px;padding:6px 10px;font-size:1rem;display:inline-flex;align-items:center;justify-content:center}
.tour-status{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--muted);min-height:1.6rem;margin:8px 2px 0;padding:4px 10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;width:fit-content;max-width:100%}
.tour-badge{display:inline-block;font-size:0.75rem;font-weight:700;letter-spacing:0.02em;text-transform:uppercase;color:var(--ink);background:var(--bg);padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tour-msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:600px){.tour-status{border-radius:8px;flex-wrap:wrap}.tour-msg{white-space:normal}}
button.active{background:var(--hl-bg);border-color:var(--hl-bar)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#code{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 0;overflow:auto;max-height:70vh;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (max-width:420px){#code{font-size:12px}}
.row{display:flex;min-width:max-content;white-space:pre;padding-right:12px;border-left:4px solid transparent}
.ln{flex:0 0 2.4em;text-align:right;padding-right:12px;color:var(--muted);user-select:none}
.row.active{background:var(--hl-bg);border-left-color:var(--hl-bar)}
.pad{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pad[hidden]{display:none}
.pad button{min-width:36px;min-height:36px;padding:4px 0;text-transform:uppercase}
.pad .wide{min-width:92px;padding:4px 12px;text-transform:none}
.word-form{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.word-form[hidden]{display:none}
.word-form label{display:grid;gap:4px;color:var(--muted);font-size:.85rem}
.word-form input{width:min(100%,15rem);min-height:36px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
.word-form input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.word-help{flex-basis:100%;margin:0;color:var(--muted);font-size:.82rem}
.word-status{flex-basis:100%;margin:0;color:var(--muted);font-size:.82rem}

/* ---------- top navigation bar ---------- */
.top-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 10px;margin-bottom:10px;border-bottom:1px solid var(--line);font-size:0.875rem}
.top-nav a{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-weight:550;padding:4px 8px;border-radius:6px;transition:background 120ms ease,color 120ms ease}
.top-nav a:hover{background:var(--btnHover);color:var(--accent)}
.top-nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav-back{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.nav-back .nav-arrow{font-size:1.05em;transition:transform 120ms ease}
.nav-back:hover .nav-arrow{transform:translateX(-2px)}
.nav-sequence{display:inline-flex;align-items:center;gap:6px}
.nav-btn{background:var(--btn);border:1px solid var(--line);padding:3px 9px;border-radius:6px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-size:0.82rem;font-weight:550}
.nav-btn:hover:not(.disabled){background:var(--btnHover);border-color:var(--accent);color:var(--accent)}
.nav-btn.disabled{opacity:0.35;cursor:not-allowed;pointer-events:none}
.nav-indicator{font-size:0.8rem;color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums;user-select:none;font-weight:600}
.nav-arrow{font-size:1em;line-height:1}
@media (max-width:540px){
  .top-nav{flex-wrap:wrap;gap:8px}
  .nav-back span:not(.nav-arrow){font-size:0.82rem}
  .btn-show-code .nav-label{display:none}
  .btn-show-code{padding:3px 8px}
}

/* ---------- collapsible code pane & full-width mode ---------- */
.code-pane{display:flex;flex-direction:column;min-width:0}
.code-header{display:flex;align-items:center;justify-content:space-between;padding:5px 12px;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:12px 12px 0 0;font-size:0.8rem;font-weight:600;color:var(--muted)}
.code-header .code-title{text-transform:uppercase;letter-spacing:0.06em;font-size:0.75rem}
.code-pane #code{border-top-left-radius:0;border-top-right-radius:0}
.btn-toggle-code{background:transparent;border:1px solid transparent;color:var(--muted);padding:2px 8px;border-radius:6px;font:inherit;font-size:0.78rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;min-height:unset;min-width:unset;transition:background 120ms ease,color 120ms ease,border-color 120ms ease}
.btn-toggle-code:hover{background:var(--btnHover);color:var(--ink);border-color:var(--line)}
.btn-toggle-code:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-toggle-code .eye-icon{font-size:1em;line-height:1}
.btn-show-code{display:inline-flex;align-items:center;gap:5px}
.btn-show-code[hidden]{display:none!important}
</style>
</head>

      <a class="nav-btn prev" href="../08-hangman/Hangman%20in%203D,%20step%20by%20step.html" title="Previous visualization: Hangman in 3D"><span class="nav-arrow" aria-hidden="true">‹</span><span class="nav-label">Prev</span></a>

  <h1>Hangman in 3D, step by step</h1>
  <div class="wrap" id="wrap">
    <div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* SOURCE:BEGIN */
const SRC = [
  'def play_hangman(word, guesses, max_attempts):',
  '    guessed = []',
  '    wrong = []',
  '    status = "playing"',
  '    for letter in guesses:',
  '        if letter in guessed:',
  '            continue',
  '        guessed.append(letter)',
  '        if letter not in word:',
  '            wrong.append(letter)',
  '        revealed = 0',
  '        for ch in word:',
  '            if ch in guessed:',
  '                revealed += 1',
  '        if revealed == len(word):',
  '            status = "won"',
  '            break',
  '        if len(wrong) >= max_attempts:',
  '            status = "lost"',
  '            break',
  '    display = ""',
  '    for ch in word:',
  '        if ch in guessed:',
  '            display += ch',
  '        else:',
  '            display += "_"',
  '    return status, display, wrong'
];
/* SOURCE:END */

/* PRESETS:BEGIN */
const PRESETS = [
  { name:'apple: won with one miss',      args:['apple', ['a','z','p','l','e'], 3] },
  { name:'python: lost after 3 misses',   args:['python', ['a','b','c','d'], 3] },
  { name:'python: repeat, still playing', args:['python', ['p','p','y'], 5] },
  { name:'a: no guesses',                 args:['a', [], 3] },
  { name:'banana: own word',              args:['banana', ['n','n','x','a','b'], 4] }
];
/* PRESETS:END */

/* SIMULATE:BEGIN */
function simulate(word, guesses, max){
  const n = word.length, guessed = [], wrong = [], frames = [];
  let status = 'playing', last = null, res = null, hits = [];
  const q = function(x){ return '"' + x + '"'; };
  const list = function(a){ return '[' + a.map(q).join(', ') + ']'; };
  const has = function(i){ return guessed.indexOf(word[i]) >= 0; };
  function disp(){ let d = ''; for (let i = 0; i < n; i++) d += has(i) ? word[i] : '_'; return d; }
  function snap(lines, msg, kind, hold){
    const shown = []; for (let i = 0; i < n; i++) shown.push(has(i));
    frames.push({ lines: lines.slice(), msg: msg, kind: kind, hold: hold, word: word, max: max, guessed: guessed.slice(),
      wrong: wrong.slice(), shown: shown, display: disp(), last: last, res: res, hits: hits.slice(), status: status });
  }
  snap([], 'Key idea: a repeat costs nothing, a miss spends an attempt, and play stops the moment the game is won or lost.', 'start', 1);
  snap([1, 2, 3], 'The word has ' + n + ' letters and ' + max + ' wrong guesses are allowed. guessed = [], wrong = [].', 'init', 1);
  let ended = false;
  for (let g = 0; g < guesses.length && !ended; g++){
    const letter = guesses[g]; last = letter; hits = [];
    if (guessed.indexOf(letter) >= 0){
      res = 'repeat';
      snap([4, 5, 6], 'Guess ' + q(letter) + ' was already played, so skip it: no change and no attempt lost.', 'step', 1);
      continue;
    }
    guessed.push(letter);
    const miss = word.indexOf(letter) < 0;
    if (miss){ wrong.push(letter); res = 'miss'; }
    else { res = 'hit'; for (let i = 0; i < n; i++) if (word[i] === letter) hits.push(i); }
    let revealed = 0; for (let i = 0; i < n; i++) if (has(i)) revealed++;
    let lines = miss ? [4, 5, 7, 8, 9, 10, 11, 12] : [4, 5, 7, 8, 10, 11, 12];
    if (revealed > 0) lines.push(13);
    const lead = miss ? 'Guess ' + q(letter) + ' is not in the word: wrong = ' + list(wrong) + ', ' + wrong.length + ' of ' + max + ' attempts used.'
      : 'Guess ' + q(letter) + ' is in the word: it reveals ' + hits.length + ' letter' + (hits.length === 1 ? '' : 's') + ', ' + revealed + ' of ' + n + ' shown.';
    if (revealed === n){ status = 'won'; ended = true; snap(lines.concat([14, 15, 16]), lead + ' All letters shown: status = "won", stop.', 'step', 1.6); }
    else if (wrong.length >= max){ status = 'lost'; ended = true; snap(lines.concat([14, 17, 18, 19]), lead + ' Attempts used up: status = "lost", stop.', 'step', 1.6); }
    else snap(lines.concat([14, 17]), lead + ' Game continues.', 'step', 1.3);
  }
  res = null; hits = [];
  if (!ended) snap([4], guesses.length === 0 ? 'guesses is empty, so the loop never runs.' : 'The guesses ran out before the game ended: status stays "playing".', 'step', 1);
  snap([20, 21, 22, 23, 24, 25], 'Build display from the guessed letters: ' + q(disp()) + '.', 'step', 1);
  snap([26], 'Return (' + q(status) + ', ' + q(disp()) + ', ' + list(wrong) + ').', 'end', 1);
  return { frames: frames, result: [status, disp(), wrong.slice()] };
}
/* SIMULATE:END */

/* ---------- DOM ---------- */
const $ = function(id){ return document.getElementById(id); };
const $cv = $('cv'), $stage = $('stage'), $cap = $('caption'), $tag = $('tag'), $err = $('err'), $code = $('code');
const $wrap = $('wrap'), $codePane = $('codePane'), $bHideCode = $('bHideCode'), $bShowCodeNav = $('bShowCodeNav');
const $tour = $('bTour'), $back = $('bBack'), $play = $('bPlay'), $next = $('bNext'), $reset = $('bReset'), $mute = $('bMute');
const $preset = $('preset'), $speed = $('speed');
const $tourStatus = $('tourStatus'), $tourBadge = $('tourBadge'), $tourMsg = $('tourMsg');
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches:false };

function toggleCodePane(collapsed){
  const willHide = (collapsed !== undefined) ? collapsed : !$wrap.classList.contains('code-hidden');
  $wrap.classList.toggle('code-hidden', willHide);
  if ($bShowCodeNav) $bShowCodeNav.hidden = !willHide;
  if (willHide && $bShowCodeNav) {
    try { $bShowCodeNav.focus(); } catch(e){}
  } else if (!willHide && $bHideCode) {
    try { $bHideCode.focus(); } catch(e){}
  }
}
if ($bHideCode) $bHideCode.addEventListener('click', function(){ toggleCodePane(true); });
if ($bShowCodeNav) $bShowCodeNav.addEventListener('click', function(){ toggleCodePane(false); });

const rows = SRC.map(function(txt, i){
  const r = document.createElement('div'); r.className = 'row';
  const n = document.createElement('span'); n.className = 'ln'; n.textContent = String(i + 1);
  const c = document.createElement('span'); c.textContent = txt;
  r.appendChild(n); r.appendChild(c); $code.appendChild(r);
  return r;
});
PRESETS.forEach(function(p, i){
  const o = document.createElement('option'); o.value = String(i); o.textContent = p.name; $preset.appendChild(o);
});
{ const po = document.createElement('option'); po.value = 'play'; po.textContent = 'Play it yourself'; $preset.appendChild(po); }
const $pad = $('pad'), padBtn = {};
const $wordForm = $('wordForm'), $customWord = $('customWord'), $wordStatus = $('wordStatus');
'abcdefghijklmnopqrstuvwxyz'.split('').forEach(function(l){
  const b = document.createElement('button'); b.type = 'button'; b.textContent = l; b.setAttribute('aria-label', 'Guess ' + l);
  b.addEventListener('click', function(){ guess(l); }); $pad.appendChild(b); padBtn[l] = b;
});
{ const nb = document.createElement('button'); nb.type = 'button'; nb.className = 'wide'; nb.textContent = 'New word'; nb.addEventListener('click', startGame); $pad.appendChild(nb); }

/* ---------- three.js scene (perspective 3D) ---------- */
const SP = 1.0, BAR_W = 0.78, BAR_COL = '#3b82c4', RES_COL = '#2e9e5b', RES_DARK = '#16683a';
const LOW_COL = '#2563a8', HIGH_COL = '#c46a14', MID_COL = '#e8a900';
const LOW_Z = 1.2, HIGH_Z = 2.2, FLOOR_Z0 = -0.8, FLOOR_Z1 = 2.9, FOCUS_Z = (FLOOR_Z0 + FLOOR_Z1) / 2;
const YAW0 = -0.22, PITCH0 = 0.46, YAW_MAX = 0.55, FOV = 32;
let gl = false, renderer = null, scene = null, camera = null;
let world = null, bars = [], vals = [], ptr = {}, slab = null, resLabel = null, emptyLabel = null;
let dims = { halfW:7, halfY:3, ty:2, maxTop:3, scale:1 };
const view = { yaw:YAW0, pitch:PITCH0, dist:20 };
const C = {};
const texCache = new Map();
const tweens = [];
let raf = 0, drag = null;

function showError(msg){ $err.hidden = false; $err.textContent = msg; }
function readTheme(){
  const cs = getComputedStyle(document.documentElement);
  ['ink','muted','plate','accent'].forEach(function(k){ C[k] = cs.getPropertyValue('--' + k).trim() || '#888888'; });
}
try {
  if (typeof THREE === 'undefined') throw new Error('three.js did not load');
  renderer = new THREE.WebGLRenderer({ canvas:$cv, antialias:true, alpha:true });
  renderer.setClearColor(0x000000, 0);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 4 / 3, 0.1, 200);
  scene.add(new THREE.AmbientLight(0xffffff, 0.58));
  const dl = new THREE.DirectionalLight(0xffffff, 0.85); dl.position.set(-5, 10, 8); scene.add(dl);
  gl = true;
} catch (e) {
  showError('The 3D view could not start (' + (e && e.message ? e.message : 'WebGL unavailable') + '). Check your connection or browser WebGL support. The code panel and captions still step through the trace.');
}

function textTex(text, style){
  const key = text + '|' + style.color + '|' + style.font;
  let t = texCache.get(key);
  if (t) return t;
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
  ctx.font = style.font;
  const w = Math.max(24, Math.ceil(ctx.measureText(text).width) + 16), h = 64;
  cv.width = w; cv.height = h;
  ctx.font = style.font; ctx.fillStyle = style.color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

/* ---------- playback state ---------- */
const S = {
  cfg: null,
  frames: [],
  idx: 0,
  state: 'paused',
  timer: 0,
  speed: 1300,
  shown: -1,
  audioMuted: false,
  currentClip: null,
  currentMilestoneIdx: -1,
  cueTimers: [],
  tourToken: 0
};

function clearCueTimers(){
  while (S.cueTimers.length > 0){
    clearTimeout(S.cueTimers.pop());
  }
}

function stopAudio(){
  clearCueTimers();
  if (S.currentClip){
    try {
      S.currentClip.pause();
      S.currentClip.currentTime = 0;
    } catch(e){}
    S.currentClip = null;
  }
  S.currentMilestoneIdx = -1;
}

function pauseAudio(){
  clearCueTimers();
  if (S.currentClip){
    try { S.currentClip.pause(); } catch(e){}
  }
}

function updateMuteButton(){
  $mute.textContent = S.audioMuted ? '🔇' : '🔊';
  $mute.title = S.audioMuted ? 'Unmute voiceover (M)' : 'Mute voiceover (M)';
  $mute.setAttribute('aria-label', S.audioMuted ? 'Unmute audio' : 'Mute audio');
}

function updateTourStatus(){
  const wt = getActiveWalkthrough(S.cfg);
  if (!wt){
    $tourStatus.hidden = true;
    return;
  }
  $tourStatus.hidden = false;
  const milestones = getMilestones(wt);
  let curM = -1;
  for (let i = 0; i < milestones.length; i++){
    if (S.idx >= milestones[i].startIdx && S.idx <= milestones[i].endIdx){
      curM = i;
      break;
    }
  }
  if (curM >= 0){
    $tourBadge.textContent = 'Milestone ' + (curM + 1) + '/' + milestones.length;
    $tourMsg.textContent = milestones[curM].title + (S.audioMuted ? ' (muted)' : '');
  } else {
    $tourBadge.textContent = 'Tour';
    $tourMsg.textContent = wt.name;
  }
}

function startMilestone(mIdx, fromTime){
  const wt = getActiveWalkthrough(S.cfg);
  if (!wt || !audioAvailable || S.audioMuted) return;

  const milestones = getMilestones(wt);
  if (mIdx < 0 || mIdx >= milestones.length) return;

  const m = milestones[mIdx];
  const clip = getMilestoneClip(wt, m);
  if (!clip){
    if (S.state === 'playing') schedule();
    return;
  }

  S.currentMilestoneIdx = mIdx;
  S.currentClip = clip;
  const token = ++S.tourToken;
  updateTourStatus();

  clip.onended = function(){
    if (token !== S.tourToken || S.state !== 'playing') return;
    if (mIdx + 1 < milestones.length){
      startMilestone(mIdx + 1, 0);
    } else {
      S.state = 'ended';
      S.currentClip = null;
      updateButtons();
      updateTourStatus();
    }
  };

  clip.onerror = function(){
    if (token !== S.tourToken) return;
    console.warn('Audio clip failed to play, switching to silent mode.');
    $tourMsg.textContent = 'Audio clips unavailable; running in silent mode.';
    S.audioMuted = true;
    updateMuteButton();
    if (S.state === 'playing') schedule();
  };

  try {
    clip.currentTime = fromTime || 0;
  } catch(e){}

  clearCueTimers();
  if (Array.isArray(m.cues)){
    m.cues.forEach(function(cue){
      const cueTime = cue.time || 0;
      const targetFrame = cue.frameIdx !== undefined ? cue.frameIdx : cue.idx;
      if (cueTime >= (fromTime || 0)){
        const delayMs = Math.max(0, (cueTime - (fromTime || 0)) * 1000);
        const timerId = setTimeout(function(){
          if (token === S.tourToken && S.state === 'playing'){
            show(targetFrame, true);
          }
        }, delayMs);
        S.cueTimers.push(timerId);
      }
    });
  }

  const playPromise = clip.play();
  if (playPromise !== undefined){
    playPromise.catch(function(err){
      if (token !== S.tourToken) return;
      if (err && err.name === 'NotAllowedError'){
        $tourMsg.textContent = 'Click Audio Tour to allow sound in your browser.';
      } else {
        $tourMsg.textContent = 'Audio clips unavailable; running in silent mode.';
      }
      if (S.state === 'playing') schedule();
    });
  }
}

function playMilestoneForFrame(frameIdx){
  const wt = getActiveWalkthrough(S.cfg);
  if (!wt || !audioAvailable || S.audioMuted) return;

  const milestones = getMilestones(wt);
  let mIdx = -1;
  for (let i = 0; i < milestones.length; i++){
    const m = milestones[i];
    if (frameIdx >= m.startIdx && frameIdx <= m.endIdx){
      mIdx = i;
      break;
    }
  }
  if (mIdx < 0) return;

  const m = milestones[mIdx];
  const clip = getMilestoneClip(wt, m);
  let fromTime = 0;
  if (Array.isArray(m.cues)){
    for (let c = m.cues.length - 1; c >= 0; c--){
      const fIdx = m.cues[c].frameIdx !== undefined ? m.cues[c].frameIdx : m.cues[c].idx;
      if (frameIdx >= fIdx){
        fromTime = m.cues[c].time || 0;
        break;
      }
    }
  }

  if (S.currentClip === clip && !clip.ended && clip.currentTime > fromTime){
    fromTime = clip.currentTime;
  }

  startMilestone(mIdx, fromTime);
}

function tweenDur(f){ return S.state === 'playing' ? Math.max(120, Math.min(600, S.speed * f.hold * 0.5)) : 450; }

    set(to);

function applyScene(f, animate){
  if (!gl || !world) return;
  bars.forEach(function(b){
    let on, hv, text, op, col, gold, green;
    if (b.k === 'w'){
      on = f.shown[b.i]; hv = on ? WORD_H : 0.12; text = on ? f.word[b.i] : '_'; op = on ? 1 : 0.45;
      green = f.status === 'won'; col = green ? RES_COL : BAR_COL; gold = f.hits.indexOf(b.i) >= 0;
    } else {
      on = b.i < f.wrong.length; hv = on ? ATT_H : 0.12; text = on ? f.wrong[b.i] : ''; op = on ? 1 : 0.25;
      green = false; col = HIGH_COL; gold = f.res === 'miss' && b.i === f.wrong.length - 1;
    }
    setText(b.lab, text, { font:SANS, color:C.ink }, 0.5, b.x);
    easeProp(function(){ return b.h; }, function(v){ setH(b, v); }, hv, animate, f);
    b.body.material.opacity = op; b.body.material.color.set(col);
    b.body.material.emissive.set(gold ? '#5a4300' : '#000000');
    b.outline.visible = gold || green; b.outline.material.color.set(gold ? C.accent : RES_DARK);
  });
  if (f.status !== 'playing' || f.kind === 'end'){
    resLabel.position.set(0, dims.maxTop + 0.9, 0);
    setText(resLabel, f.status, { font:SANS, color: f.status === 'won' ? RES_COL : (f.status === 'lost' ? HIGH_COL : C.muted) }, 0.38, 0);
  } else {
    resLabel.visible = false;
  }
  requestRender();
}

function renderCode(f){
  let firstActive = -1;
  rows.forEach(function(r, i){
    const a = f.lines.indexOf(i) >= 0;
    r.classList.toggle('active', a);
    if (a && firstActive < 0) firstActive = i;
  });
  if (firstActive >= 0){
    const r = rows[firstActive];
    if (r.offsetTop < $code.scrollTop) $code.scrollTop = r.offsetTop;
    else if (r.offsetTop + r.offsetHeight > $code.scrollTop + $code.clientHeight) $code.scrollTop = r.offsetTop + r.offsetHeight - $code.clientHeight;
  }
}
function describe(f){
  return 'Hangman word of ' + f.word.length + ' letters shown as ' + f.display + '. Wrong guesses: ' + (f.wrong.length ? f.wrong.join(', ') : 'none') + ' of ' + f.max + '. Status ' + f.status + '.';
}
function updateButtons(){
  const last = S.frames.length - 1;
  $back.disabled = S.idx <= 0;
  $next.disabled = S.idx >= last;
  $play.textContent = S.state === 'playing' ? 'Pause' : (S.idx >= last ? 'Replay' : 'Play');

  const isTourPlaying = S.state === 'playing';
  $tour.classList.toggle('playing', isTourPlaying);
  const lbl = $tour.querySelector('.tour-label');
  if (lbl){
    lbl.textContent = isTourPlaying ? 'Pause' : (S.idx >= last ? 'Replay' : 'Audio Tour');
  }
  const icn = $tour.querySelector('.tour-icon');
  if (icn){
    icn.textContent = isTourPlaying ? '⏸' : '▶';
  }
}
function show(i, animate){
  const f = S.frames[i]; if (!f) return;
  settle();
  S.idx = i;
  $cap.textContent = f.msg;
  $tag.textContent = (f.last ? 'guess "' + f.last + '"' : 'no guess yet') + ' \u00b7 wrong ' + f.wrong.length + '/' + f.max + ' \u00b7 ' + f.status;
  $cv.setAttribute('aria-label', describe(f));
  renderCode(f);
  applyScene(f, animate && Math.abs(i - S.shown) === 1);
  S.shown = i;
  updateButtons();
  updateTourStatus();
}

function clearTimer(){ if (S.timer){ clearTimeout(S.timer); S.timer = 0; } }
function schedule(){
  clearTimer();
  if (S.state !== 'playing') return;
  const wt = getActiveWalkthrough(S.cfg);
  if (wt && audioAvailable && !S.audioMuted && S.currentClip && !S.currentClip.paused){
    return;
  }
  S.timer = setTimeout(tick, S.speed * S.frames[S.idx].hold);
}
function tick(){

  if (S.idx >= S.frames.length - 1){ S.state = 'ended'; updateButtons(); updateTourStatus(); return; }
  show(S.idx + 1, true);
  if (S.idx >= S.frames.length - 1){ S.state = 'ended'; updateButtons(); updateTourStatus(); return; }
  schedule();
}
function pause(){
  clearTimer();
  settle();
  pauseAudio();
  if (S.state === 'playing' || S.state === 'ended') S.state = 'paused';
  updateButtons();
  updateTourStatus();
}
function play(){
  if (S.state === 'playing'){ pause(); return; }
  if (S.idx >= S.frames.length - 1) show(0, false);
  S.state = 'playing'; updateButtons();
  const wt = getActiveWalkthrough(S.cfg);
  if (wt && audioAvailable && !S.audioMuted){
    playMilestoneForFrame(S.idx);
  } else {
    updateTourStatus();
    schedule();
  }
}
function step(d){
  stopAudio();
  pause();
  const j = S.idx + d;
  if (j < 0 || j >= S.frames.length) return;
  show(j, true);
}
function reset(){
  stopAudio();
  pause();
  show(0, false);
}
function toggleMute(){
  S.audioMuted = !S.audioMuted;
  updateMuteButton();
  if (S.audioMuted){
    pauseAudio();
    if (S.state === 'playing') schedule();
  } else {
    clearTimer();
    if (S.state === 'playing') playMilestoneForFrame(S.idx);
  }
  updateTourStatus();
}
function loadPreset(i){
  stopAudio();
  pause();
  $preset.value = String(i);
  const p = PRESETS[i];
  S.cfg = { name:p.name, word:p.args[0], guesses:p.args[1], max:p.args[2] };
  S.frames = simulate.apply(null, p.args).frames; S.shown = -1; S.idx = 0;
  build(S.cfg);
  show(0, false);
  updateTourStatus();
}

$tour.addEventListener('click', play);
$mute.addEventListener('click', toggleMute);
$back.addEventListener('click', function(){ step(-1); });
$next.addEventListener('click', function(){ step(1); });
$play.addEventListener('click', play);
$reset.addEventListener('click', reset);
$preset.addEventListener('change', function(){
  if ($preset.value === 'play'){ startGame(); return; }
  G.on = false; G.over = false; $pad.hidden = true; $wordForm.hidden = true; loadPreset(Number($preset.value));
});
$speed.addEventListener('change', function(){
  S.speed = Number($speed.value);
  if (S.state === 'playing') schedule();
});
document.addEventListener('keydown', function(e){
  const t = e.target && e.target.tagName;
  if (t === 'BUTTON' || t === 'SELECT' || t === 'INPUT' || t === 'TEXTAREA' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (G.on){
    if (/^[a-z]$/i.test(e.key)) guess(e.key.toLowerCase());
    return;
  }
  if (e.key === ' '){ e.preventDefault(); play(); }
  else if (e.key === 'ArrowRight'){ step(1); }
  else if (e.key === 'ArrowLeft'){ step(-1); }
  else if (e.key === 'c' || e.key === 'C'){ e.preventDefault(); toggleCodePane(); }
  else if (e.key === 'm' || e.key === 'M'){ e.preventDefault(); toggleMute(); }
});
document.addEventListener('visibilitychange', function(){ if (document.hidden && S.state === 'playing') pause(); });

if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fitCamera).observe($stage);
else window.addEventListener('resize', fitCamera);

function retheme(){
  if (!gl) return;
  clearTexCache(); readTheme(); build(S.cfg, true); S.shown = -1; show(S.idx, false);
}
try {
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
} catch (e) { /* older browsers: theme refresh on reload */ }
new MutationObserver(retheme).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });

/* ---------- play it yourself: each guess re-runs simulate() and shows that guess's frame ---------- */
const WORDS = ['python', 'banana', 'level', 'rhythm', 'apple', 'garden', 'planet', 'bridge', 'window', 'castle', 'jungle', 'puzzle'];
const G = { word:'', guesses:[], max:6, on:false, over:false };
function refreshPad(){
  Object.keys(padBtn).forEach(function(l){ padBtn[l].disabled = G.over || G.guesses.indexOf(l) >= 0; });
}
function startGame(customWord){
  stopAudio();
  pause();
  const hasCustomWord = typeof customWord !== 'undefined';
  let w = customWord;
  if (!hasCustomWord){
    w = WORDS[Math.floor(Math.random() * WORDS.length)];
    if (w === G.word) w = WORDS[(WORDS.indexOf(w) + 1) % WORDS.length];
    $wordStatus.textContent = 'Playing a randomly selected word.';
    $customWord.value = '';
  } else {
    w = w.trim();
    if (!/^[a-z]{1,12}$/.test(w)){
      $wordStatus.textContent = 'Enter 1–12 lowercase English letters.'; $customWord.focus(); return;
    }
    $wordStatus.textContent = 'Playing your chosen word.';
  }
  G.word = w; G.guesses = []; G.on = true; G.over = false;
  $pad.hidden = false;
  $wordForm.hidden = false;
  if (hasCustomWord) $customWord.value = w;
  S.cfg = { name:'Play', word:w, guesses:G.guesses, max:G.max };
  S.frames = simulate(w, [], G.max).frames; S.shown = -1; S.idx = 1;
  build(S.cfg);
  show(1, false);
  updateTourStatus();
  refreshPad();
}
function guess(letter){
  if (!G.on || G.over) return;
  G.guesses.push(letter);
  pause();
  S.frames = simulate(G.word, G.guesses, G.max).frames;
  show(1 + G.guesses.length, true);
  if (S.frames[S.idx].status !== 'playing') G.over = true;
  refreshPad();
}
$wordForm.addEventListener('submit', function(e){
  e.preventDefault();
  startGame($customWord.value);
});

loadPreset(0);
})();
</script>
