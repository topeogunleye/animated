<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangman in 3D: step by step</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#18212b; --muted:#5b6876; --line:#d5dbe3;
  --hl-bg:#fff3bf; --hl-bar:#d99a00; --stage:#eef1f5;
  --plate:#c3ccd7; --accent:#e8a900;
  --btn:#ffffff; --btnHover:#eef1f5;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318; --panel:#171c23; --ink:#e8edf3; --muted:#9aa7b6; --line:#2c3440;
    --hl-bg:#4a3d0a; --hl-bar:#ffc400; --stage:#141a21;
    --plate:#3a4452; --accent:#ffc400;
    --btn:#1d2430; --btnHover:#27303b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#171c23; --ink:#e8edf3; --muted:#9aa7b6; --line:#2c3440;
  --hl-bg:#4a3d0a; --hl-bar:#ffc400; --stage:#141a21;
  --plate:#3a4452; --accent:#ffc400;
  --btn:#1d2430; --btnHover:#27303b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:1120px;margin:0 auto;padding:12px 14px 22px}
h1{font-size:1.15rem;margin:4px 0 12px;font-weight:650}
.wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}}
.stagebox{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:4/3;min-height:260px;max-height:64vh;width:100%}
#cv{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
#cv:active{cursor:grabbing}
.hint{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--muted);pointer-events:none}
.tag{position:absolute;top:8px;left:10px;right:10px;width:max-content;max-width:calc(100% - 20px);font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--panel);border:1px solid var(--line);padding:2px 9px;border-radius:999px}
.err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--ink);background:var(--stage)}
.err[hidden]{display:none}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.narration-status{font-size:13px;color:var(--muted);margin-top:6px;min-height:1.3em}
button,select,input{font:inherit;font-size:.9rem;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-height:36px}
button{cursor:pointer;min-width:64px}
button:hover:not(:disabled){background:var(--btnHover)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.custom-input{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.custom-input h2{font-size:1rem;margin:0 0 8px}
.input-fields{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.input-fields label{display:grid;gap:4px;color:var(--muted);font-size:.85rem}
.input-fields input[type="text"]{width:min(100%,14rem);min-height:36px;background:var(--bg)}
.input-fields input[type="number"]{width:min(100%,8rem);min-height:36px;background:var(--bg)}
.input-help,.input-status{margin:7px 0 0;color:var(--muted);font-size:.82rem}
.input-status:not(:empty){min-height:1.2em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#code{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 0;overflow:auto;max-height:70vh;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (max-width:420px){#code{font-size:12px}}
.row{display:flex;min-width:max-content;white-space:pre;padding-right:12px;border-left:4px solid transparent}
.ln{flex:0 0 2.4em;text-align:right;padding-right:12px;color:var(--muted);user-select:none}
.row.active{background:var(--hl-bg);border-left-color:var(--hl-bar)}
</style>
</head>
<body>
<main>
  <h1>Hangman in 3D, step by step</h1>
  <div class="wrap">
    <div>
      <div class="stagebox" id="stage">
        <canvas id="cv" role="img" aria-label="3D hangman word letters and wrong-guess slots"></canvas>
        <div class="tag" id="tag"></div>
        <div class="hint">drag to rotate · double-click to reset</div>
        <div class="err" id="err" hidden></div>
      </div>
      <p id="caption" role="status" aria-live="polite"></p>
      <div class="controls" role="group" aria-label="Playback controls">
        <button id="bBack" type="button">Back</button>
        <button id="bPlay" type="button">Play</button>
        <button id="bNext" type="button">Next</button>
        <button id="bReset" type="button">Reset</button>
        <button id="bNarration" type="button" aria-pressed="false">Narration: Off</button>
        <label class="sr" for="voice">Voice</label>
        <select id="voice"><option value="auto">Voice: Lauren (recorded) / System</option></select>
        <label class="sr" for="preset">Input</label>
        <select id="preset"></select>
        <label class="sr" for="speed">Speed</label>
        <select id="speed">
          <option value="1300">Slow</option>
          <option value="850">Normal</option>
          <option value="450">Fast</option>
          <option value="220">Very fast</option>
        </select>
      </div>
      <div class="narration-status" id="narrationStatus" role="status" aria-live="polite"></div>
      <form class="custom-input" id="customForm">
        <h2>Play with your own input</h2>
        <div class="input-fields">
          <label for="customWord">Secret word
            <input id="customWord" name="word" type="text" value="apple" maxlength="12" autocomplete="off" spellcheck="false" aria-describedby="inputHelp inputStatus">
          </label>
          <label for="customGuesses">Guesses, in order
            <input id="customGuesses" name="guesses" type="text" value="azple" maxlength="26" autocomplete="off" spellcheck="false" aria-describedby="inputHelp inputStatus">
          </label>
          <label for="customMax">Allowed misses
            <input id="customMax" name="max" type="number" value="3" min="1" max="8" step="1" required inputmode="numeric" aria-describedby="inputHelp inputStatus">
          </label>
          <button type="submit">Run my game</button>
        </div>
        <p class="input-help" id="inputHelp">Use lowercase English letters; guesses are played one at a time from left to right. Word length: 1–12; miss limit: 1–8.</p>
        <p class="input-status" id="inputStatus" role="status" aria-live="polite"></p>
      </form>
    </div>
    <div id="code" role="region" aria-label="Python source code"></div>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* SOURCE:BEGIN */
const SRC = [
  'def play_hangman(word, guesses, max_attempts):',
  '    guessed = []',
  '    wrong = []',
  '    status = "playing"',
  '    for letter in guesses:',
  '        if letter in guessed:',
  '            continue',
  '        guessed.append(letter)',
  '        if letter not in word:',
  '            wrong.append(letter)',
  '        revealed = 0',
  '        for ch in word:',
  '            if ch in guessed:',
  '                revealed += 1',
  '        if revealed == len(word):',
  '            status = "won"',
  '            break',
  '        if len(wrong) >= max_attempts:',
  '            status = "lost"',
  '            break',
  '    display = ""',
  '    for ch in word:',
  '        if ch in guessed:',
  '            display += ch',
  '        else:',
  '            display += "_"',
  '    return status, display, wrong'
];
/* SOURCE:END */

/* PRESETS:BEGIN */
const PRESETS = [
  { name:'apple: won with one miss',      args:['apple', ['a','z','p','l','e'], 3] },
  { name:'python: lost after 3 misses',   args:['python', ['a','b','c','d'], 3] },
  { name:'python: repeat, still playing', args:['python', ['p','p','y'], 5] },
  { name:'a: no guesses',                 args:['a', [], 3] },
  { name:'banana: own word',              args:['banana', ['n','n','x','a','b'], 4] }
];
/* PRESETS:END */

/* SIMULATE:BEGIN */
function simulate(word, guesses, max){
  const n = word.length, guessed = [], wrong = [], frames = [];
  let status = 'playing', last = null, res = null, hits = [];
  const q = function(x){ return '"' + x + '"'; };
  const list = function(a){ return '[' + a.map(q).join(', ') + ']'; };
  const has = function(i){ return guessed.indexOf(word[i]) >= 0; };
  function disp(){ let d = ''; for (let i = 0; i < n; i++) d += has(i) ? word[i] : '_'; return d; }
  function snap(lines, msg, kind, hold){
    const shown = []; for (let i = 0; i < n; i++) shown.push(has(i));
    frames.push({ lines: lines.slice(), msg: msg, kind: kind, hold: hold, word: word, max: max, guessed: guessed.slice(),
      wrong: wrong.slice(), shown: shown, display: disp(), last: last, res: res, hits: hits.slice(), status: status });
  }
  snap([], 'Key idea: a repeat costs nothing, a miss spends an attempt, and play stops the moment the game is won or lost.', 'start', 1);
  snap([1, 2, 3], 'The word has ' + n + ' letters and ' + max + ' wrong guesses are allowed. guessed = [], wrong = [].', 'init', 1);
  let ended = false;
  for (let g = 0; g < guesses.length && !ended; g++){
    const letter = guesses[g]; last = letter; hits = [];
    if (guessed.indexOf(letter) >= 0){
      res = 'repeat';
      snap([4, 5, 6], 'Guess ' + q(letter) + ' was already played, so skip it: no change and no attempt lost.', 'step', 1);
      continue;
    }
    guessed.push(letter);
    const miss = word.indexOf(letter) < 0;
    if (miss){ wrong.push(letter); res = 'miss'; }
    else { res = 'hit'; for (let i = 0; i < n; i++) if (word[i] === letter) hits.push(i); }
    let revealed = 0; for (let i = 0; i < n; i++) if (has(i)) revealed++;
    let lines = miss ? [4, 5, 7, 8, 9, 10, 11, 12] : [4, 5, 7, 8, 10, 11, 12];
    if (revealed > 0) lines.push(13);
    const lead = miss ? 'Guess ' + q(letter) + ' is not in the word: wrong = ' + list(wrong) + ', ' + wrong.length + ' of ' + max + ' attempts used.'
      : 'Guess ' + q(letter) + ' is in the word: it reveals ' + hits.length + ' letter' + (hits.length === 1 ? '' : 's') + ', ' + revealed + ' of ' + n + ' shown.';
    if (revealed === n){ status = 'won'; ended = true; snap(lines.concat([14, 15, 16]), lead + ' All letters shown: status = "won", stop.', 'step', 1.6); }
    else if (wrong.length >= max){ status = 'lost'; ended = true; snap(lines.concat([14, 17, 18, 19]), lead + ' Attempts used up: status = "lost", stop.', 'step', 1.6); }
    else snap(lines.concat([14, 17]), lead + ' Game continues.', 'step', 1.3);
  }
  res = null; hits = [];
  if (!ended) snap([4], guesses.length === 0 ? 'guesses is empty, so the loop never runs.' : 'The guesses ran out before the game ended: status stays "playing".', 'step', 1);
  snap([20, 21, 22, 23, 24, 25], 'Build display from the guessed letters: ' + q(disp()) + '.', 'step', 1);
  snap([26], 'Return (' + q(status) + ', ' + q(disp()) + ', ' + list(wrong) + ').', 'end', 1);
  return { frames: frames, result: [status, disp(), wrong.slice()] };
}
/* SIMULATE:END */

/* ---------- DOM ---------- */
const $ = function(id){ return document.getElementById(id); };
const $cv = $('cv'), $stage = $('stage'), $cap = $('caption'), $tag = $('tag'), $err = $('err'), $code = $('code');
const $back = $('bBack'), $play = $('bPlay'), $next = $('bNext'), $reset = $('bReset'), $preset = $('preset'), $speed = $('speed');
const $narration = $('bNarration'), $voice = $('voice'), $narrationStatus = $('narrationStatus');
const $customForm = $('customForm'), $customWord = $('customWord'), $customGuesses = $('customGuesses'), $customMax = $('customMax'), $inputStatus = $('inputStatus');
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches:false };

const rows = SRC.map(function(txt, i){
  const r = document.createElement('div'); r.className = 'row';
  const n = document.createElement('span'); n.className = 'ln'; n.textContent = String(i + 1);
  const c = document.createElement('span'); c.textContent = txt;
  r.appendChild(n); r.appendChild(c); $code.appendChild(r);
  return r;
});
PRESETS.forEach(function(p, i){
  const o = document.createElement('option'); o.value = String(i); o.textContent = p.name; $preset.appendChild(o);
});

/* ---------- three.js scene (perspective 3D) ---------- */
const SP = 1.0, BAR_W = 0.78, BAR_COL = '#3b82c4', RES_COL = '#2e9e5b', RES_DARK = '#16683a';
const LOW_COL = '#2563a8', HIGH_COL = '#c46a14', MID_COL = '#e8a900';
const LOW_Z = 1.2, HIGH_Z = 2.2, FLOOR_Z0 = -0.8, FLOOR_Z1 = 2.9, FOCUS_Z = (FLOOR_Z0 + FLOOR_Z1) / 2;
const YAW0 = -0.22, PITCH0 = 0.46, YAW_MAX = 0.55, FOV = 32;
let gl = false, renderer = null, scene = null, camera = null;
let world = null, bars = [], vals = [], ptr = {}, slab = null, resLabel = null, emptyLabel = null;
let dims = { halfW:7, halfY:3, ty:2, maxTop:3, scale:1 };
const view = { yaw:YAW0, pitch:PITCH0, dist:20 };
const C = {};
const texCache = new Map();
const tweens = [];
let raf = 0, drag = null;

function showError(msg){ $err.hidden = false; $err.textContent = msg; }
function readTheme(){
  const cs = getComputedStyle(document.documentElement);
  ['ink','muted','plate','accent'].forEach(function(k){ C[k] = cs.getPropertyValue('--' + k).trim() || '#888888'; });
}
try {
  if (typeof THREE === 'undefined') throw new Error('three.js did not load');
  renderer = new THREE.WebGLRenderer({ canvas:$cv, antialias:true, alpha:true });
  renderer.setClearColor(0x000000, 0);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 4 / 3, 0.1, 200);
  scene.add(new THREE.AmbientLight(0xffffff, 0.58));
  const dl = new THREE.DirectionalLight(0xffffff, 0.85); dl.position.set(-5, 10, 8); scene.add(dl);
  gl = true;
} catch (e) {
  showError('The 3D view could not start (' + (e && e.message ? e.message : 'WebGL unavailable') + '). Check your connection or browser WebGL support. The code panel and captions still step through the trace.');
}

function textTex(text, style){
  const key = text + '|' + style.color + '|' + style.font;
  let t = texCache.get(key);
  if (t) return t;
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
  ctx.font = style.font;
  const w = Math.max(24, Math.ceil(ctx.measureText(text).width) + 16), h = 64;
  cv.width = w; cv.height = h;
  ctx.font = style.font; ctx.fillStyle = style.color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, w / 2, h / 2 + 2);
  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  t = { tex:tex, aspect:w / h };
  texCache.set(key, t);
  return t;
}
function clearTexCache(){ texCache.forEach(function(t){ t.tex.dispose(); }); texCache.clear(); }
function makeSprite(){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ transparent:true, depthTest:false }));
  s.renderOrder = 10; s.visible = false; return s;
}
function setText(s, text, style, worldH, x){
  if (!text){ s.visible = false; return; }
  const t = textTex(text, style);
  s.material.map = t.tex; s.material.needsUpdate = true;
  s.scale.set(worldH * t.aspect, worldH, 1);
  if (x !== undefined) s.position.x = x;
  s.visible = true;
}
const SANS = '700 48px system-ui, -apple-system, "Segoe UI", sans-serif';
function slotX(i, n){ return (i - (n - 1) / 2) * SP; }
function barH(v){ return Math.max(v * dims.scale, 0.12); }

function clearWorld(){
  tweens.length = 0;
  if (!world) return;
  world.traverse(function(o){
    if (o.geometry) o.geometry.dispose();
    if (o.material) o.material.dispose();
  });
  scene.remove(world); world = null; bars = []; vals = []; ptr = {}; slab = null; resLabel = null; emptyLabel = null;
}

function makePointer(name, color, up, coneY, labelY, z){
  const g = new THREE.Group();
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 20), new THREE.MeshLambertMaterial({ color:color }));
  cone.position.y = coneY;
  if (!up) cone.rotation.z = Math.PI;
  const lab = makeSprite(); lab.position.y = labelY;
  setText(lab, name, { font:SANS, color:color }, 0.4, 0);
  g.add(cone); g.add(lab); g.position.z = z; g.visible = false;
  return g;
}

const WORD_H = 2.0, ATT_H = 1.0, ATT_Z = 1.8;
function setH(b, hv){
  b.h = hv; b.body.scale.y = hv; b.body.position.y = hv / 2;
  b.outline.scale.y = hv + 0.14; b.outline.position.y = hv / 2; b.lab.position.y = hv + 0.32;
}
function build(cfg, keepView){
  if (!gl) return;
  clearWorld(); readTheme();
  world = new THREE.Group(); scene.add(world);
  const n = cfg.word.length, A = cfg.max, W = Math.max(n, A, 1);
  dims.maxTop = WORD_H; dims.halfW = (W + 2) * SP / 2 + 0.7; dims.halfY = 2.6; dims.ty = 2.2;
  const floor = new THREE.Mesh(new THREE.BoxGeometry(W * SP + 0.9, 0.14, FLOOR_Z1 - FLOOR_Z0), new THREE.MeshLambertMaterial({ color:C.plate }));
  floor.position.set(0, -0.07, FOCUS_Z); world.add(floor);
  function cell(kind, i, count, z){
    const x = slotX(i, count);
    const body = new THREE.Mesh(new THREE.BoxGeometry(BAR_W, 1, BAR_W), new THREE.MeshLambertMaterial({ color:BAR_COL, transparent:true }));
    const outline = new THREE.Mesh(new THREE.BoxGeometry(BAR_W + 0.14, 1, BAR_W + 0.14), new THREE.MeshBasicMaterial({ color:C.accent, side:THREE.BackSide }));
    const lab = makeSprite(); lab.position.set(x, 0, z);
    body.position.set(x, 0, z); outline.position.set(x, 0, z); outline.visible = false;
    world.add(outline); world.add(body); world.add(lab);
    const b = { k:kind, i:i, x:x, body:body, outline:outline, lab:lab, h:0.12 }; setH(b, 0.12); bars.push(b);
  }
  for (let i = 0; i < n; i++) cell('w', i, n, 0);
  for (let j = 0; j < A; j++) cell('a', j, A, ATT_Z);
  [['word', 0.95], ['wrong guesses', 2.6]].forEach(function(r){
    const t = makeSprite(); t.position.set(0, 0.3, r[1]);
    setText(t, r[0], { font:SANS, color:C.muted }, 0.34, 0); world.add(t);
  });
  resLabel = makeSprite(); world.add(resLabel);
  if (!keepView){ view.yaw = YAW0; view.pitch = PITCH0; }
  fitCamera();
}

function updateCamera(){
  if (!gl) return;
  const cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  camera.position.set(Math.sin(view.yaw) * cp * view.dist, dims.ty + sp * view.dist, FOCUS_Z + Math.cos(view.yaw) * cp * view.dist);
  camera.lookAt(0, dims.ty, FOCUS_Z);
  requestRender();
}
function fitCamera(){
  if (!gl) return;
  const w = $stage.clientWidth, h = $stage.clientHeight;
  if (!w || !h) return;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  const aspect = w / h, t = Math.tan(FOV * Math.PI / 360), halfZ = (FLOOR_Z1 - FLOOR_Z0) / 2;
  camera.aspect = aspect; camera.updateProjectionMatrix();
  const vExt = dims.halfY * Math.cos(PITCH0) + halfZ * Math.sin(PITCH0);
  const hExt = dims.halfW * Math.cos(YAW_MAX) + halfZ * Math.sin(YAW_MAX);
  view.dist = Math.max(vExt / t, hExt / (t * aspect)) * 1.2;
  updateCamera();
}

/* ---------- tweens and render loop ---------- */
function settle(){ tweens.splice(0).forEach(function(tw){ tw.upd(1); }); }
function requestRender(){ if (gl && !raf) raf = requestAnimationFrame(loop); }
function loop(){
  raf = 0;
  const now = performance.now();
  for (let i = tweens.length - 1; i >= 0; i--){
    const tw = tweens[i];
    const u = Math.max(0, Math.min(1, (now - tw.t0) / tw.dur));
    tw.upd(u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
    if (u >= 1) tweens.splice(i, 1);
  }
  renderer.render(scene, camera);
  if (tweens.length) requestRender();
}

/* drag left or right to turn the scene; double-click resets the view */
if (gl){
  $cv.addEventListener('pointerdown', function(e){
    drag = { x:e.clientX, yaw:view.yaw };
    try { $cv.setPointerCapture(e.pointerId); } catch (err) { /* not needed for the drag to work */ }
  });
  $cv.addEventListener('pointermove', function(e){
    if (!drag) return;
    view.yaw = Math.max(-YAW_MAX, Math.min(YAW_MAX, drag.yaw + (e.clientX - drag.x) * 0.008));
    updateCamera();
  });
  ['pointerup', 'pointercancel'].forEach(function(t){ $cv.addEventListener(t, function(){ drag = null; }); });
  $cv.addEventListener('dblclick', function(){ view.yaw = YAW0; view.pitch = PITCH0; updateCamera(); });
}

/* ---------- voice narration and recorded audio ---------- */
const speechAvailable = typeof window !== 'undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
const audioAvailable = typeof Audio !== 'undefined';
const narrationAvailable = speechAvailable || audioAvailable;
let availableVoices = [];

function voiceScore(v){
  let s = 0;
  const lang = (v.lang || '').toLowerCase();
  const name = (v.name || '').toLowerCase();
  if (lang.indexOf('en') === 0) s += 100;
  if (lang.indexOf('en-us') === 0 || lang.indexOf('en_us') === 0) s += 40;
  if (name.indexOf('natural') >= 0) s += 60;
  if (name.indexOf('premium') >= 0) s += 50;
  if (name.indexOf('neural') >= 0) s += 50;
  if (name.indexOf('google') >= 0) s += 30;
  if (name.indexOf('samantha') >= 0) s += 25;
  if (name.indexOf('karen') >= 0) s += 20;
  return s;
}

function refreshVoices(){
  if (!speechAvailable) return;
  try {
    availableVoices = window.speechSynthesis.getVoices() || [];
  } catch (e) {
    availableVoices = [];
  }
  const selected = $voice.value || 'auto';
  $voice.innerHTML = '';
  const automatic = document.createElement('option');
  automatic.value = 'auto';
  automatic.textContent = 'Voice: Lauren (recorded) / System';
  $voice.appendChild(automatic);
  availableVoices.slice().sort(function(a, b){
    return voiceScore(b) - voiceScore(a) || a.name.localeCompare(b.name);
  }).forEach(function(voice){
    const option = document.createElement('option');
    option.value = voice.voiceURI;
    option.textContent = voice.name + ' (' + voice.lang + ')' + (voiceScore(voice) >= 180 ? ' · natural' : '');
    $voice.appendChild(option);
  });
  $voice.value = Array.from($voice.options).some(function(option){ return option.value === selected; }) ? selected : 'auto';
  S.voiceURI = $voice.value;
}

function makeAudio(src){
  const a = new Audio();
  a.preload = 'auto';
  a.src = src;
  return a;
}

const WALKTHROUGHS = {
  appleWon: {
    id: 'appleWon',
    name: 'apple: won with one miss',
    match: function(cfg){
      return cfg && cfg.word === 'apple' && Array.isArray(cfg.guesses) && cfg.guesses.join('') === 'azple' && cfg.max === 3;
    },
    clips: {
      setupAndEarly: makeAudio('../audio-walkthroughs/hangman/apple-won/01-setup-and-early-guesses.mp3'),
      solvingAndVictory: makeAudio('../audio-walkthroughs/hangman/apple-won/02-solving-and-victory.mp3')
    },
    mapping: [
      {
        clip: 'setupAndEarly',
        startIdx: 0,
        endIdx: 4,
        cues: [
          { time: 0, idx: 0 },
          { time: 17.0, idx: 1 },
          { time: 24.0, idx: 2 },
          { time: 31.0, idx: 3 },
          { time: 38.0, idx: 4 }
        ]
      },
      {
        clip: 'solvingAndVictory',
        startIdx: 5,
        endIdx: 8,
        cues: [
          { time: 0, idx: 5 },
          { time: 6.0, idx: 6 },
          { time: 18.0, idx: 7 },
          { time: 22.0, idx: 8 }
        ]
      }
    ]
  },
  pythonLost: {
    id: 'pythonLost',
    name: 'python: lost after 3 misses',
    match: function(cfg){
      return cfg && cfg.word === 'python' && Array.isArray(cfg.guesses) && cfg.guesses.join('') === 'abcd' && cfg.max === 3;
    },
    clips: {
      setupAndMisses: makeAudio('../audio-walkthroughs/hangman/python-lost/01-setup-and-consecutive-misses.mp3'),
      finalMissAndLoss: makeAudio('../audio-walkthroughs/hangman/python-lost/02-final-miss-and-loss.mp3')
    },
    mapping: [
      {
        clip: 'setupAndMisses',
        startIdx: 0,
        endIdx: 3,
        cues: [
          { time: 0, idx: 0 },
          { time: 9.0, idx: 1 },
          { time: 14.0, idx: 2 },
          { time: 19.0, idx: 3 }
        ]
      },
      {
        clip: 'finalMissAndLoss',
        startIdx: 4,
        endIdx: 6,
        cues: [
          { time: 0, idx: 4 },
          { time: 16.0, idx: 5 },
          { time: 21.0, idx: 6 }
        ]
      }
    ]
  }
};

function getActiveWalkthrough(cfg){
  if (!cfg) return null;
  const keys = Object.keys(WALKTHROUGHS);
  for (let i = 0; i < keys.length; i++){
    const wt = WALKTHROUGHS[keys[i]];
    if (wt.match(cfg)) return wt;
  }
  return null;
}

function narrationStatusMessage(cfg){
  const wt = getActiveWalkthrough(cfg);
  if (wt){
    return 'Narration enabled (using recorded voice walkthrough for ' + wt.name + ').';
  }
  return 'Narration enabled (using browser speech synthesis for custom/other inputs).';
}

function tutorNarration(frame){
  if (!frame) return '';
  return frame.msg;
}

function speakTutor(frame, token, onComplete){
  if (!speechAvailable || !S.narration || token !== S.narrationToken){
    if (onComplete) onComplete();
    return;
  }
  try { window.speechSynthesis.cancel(); } catch(e){}
  const text = tutorNarration(frame);
  if (!text){
    if (onComplete) onComplete();
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  if (S.voiceURI && S.voiceURI !== 'auto'){
    const chosen = availableVoices.find(function(v){ return v.voiceURI === S.voiceURI; });
    if (chosen) u.voice = chosen;
  }
  u.onend = function(){
    if (token === S.narrationToken && onComplete) onComplete();
  };
  u.onerror = function(){
    if (token === S.narrationToken && onComplete) onComplete();
  };
  try {
    window.speechSynthesis.speak(u);
  } catch(e){
    if (onComplete) onComplete();
  }
}

function clearCueTimers(){
  while (S.cueTimers.length){
    clearTimeout(S.cueTimers.pop());
  }
}

function cancelNarration(){
  const wasPending = S.narrationPending;
  S.narrationToken += 1;
  S.narrationPending = false;
  clearCueTimers();
  S.currentClip = null;
  Object.keys(WALKTHROUGHS).forEach(function(wKey){
    const clips = WALKTHROUGHS[wKey].clips;
    Object.keys(clips).forEach(function(k){
      const c = clips[k];
      c.pause();
      c.currentTime = 0;
      c.onended = null;
      c.onerror = null;
    });
  });
  if (speechAvailable && wasPending){
    try { window.speechSynthesis.cancel(); } catch(e){}
  }
}

function speakFrame(frame){
  const wt = getActiveWalkthrough(S.cfg);
  let milestone = null;
  if (wt){
    milestone = wt.mapping.find(function(m){ return S.idx >= m.startIdx && S.idx <= m.endIdx; });
  }

  const expectedClip = (wt && milestone) ? wt.clips[milestone.clip] : null;
  if (expectedClip && S.currentClip === expectedClip && !expectedClip.paused && !expectedClip.ended){
    return;
  }

  cancelNarration();
  if (!S.narration || !narrationAvailable) return;

  const token = S.narrationToken;
  const finish = function(){
    if (token !== S.narrationToken) return;
    S.narrationPending = false;
    S.currentClip = null;
    clearCueTimers();
    if (S.state === 'playing'){
      if (S.idx >= S.frames.length - 1){
        S.state = 'ended';
        updateButtons();
      } else {
        schedule();
      }
    }
  };
  S.narrationPending = true;

  if (wt && audioAvailable && milestone){
    const clip = wt.clips[milestone.clip];
    S.currentClip = clip;
    let fellBack = false;
    const fallback = function(){
      if (fellBack || token !== S.narrationToken) return;
      fellBack = true;
      clip.onended = null;
      clip.onerror = null;
      S.currentClip = null;
      clearCueTimers();
      $narrationStatus.textContent = 'A recorded narration clip could not play; using browser speech instead.';
      speakTutor(frame, token, finish);
    };

    clip.onended = finish;
    clip.onerror = fallback;

    let currentCue = null;
    for (let c = milestone.cues.length - 1; c >= 0; c--){
      if (S.idx >= milestone.cues[c].idx){
        currentCue = milestone.cues[c];
        break;
      }
    }
    if (!currentCue) currentCue = milestone.cues[0];

    try { clip.currentTime = currentCue.time; } catch(e){}

    if (S.state === 'playing'){
      milestone.cues.forEach(function(cue){
        if (cue.time > currentCue.time){
          const delay = (cue.time - currentCue.time) * 1000;
          const tid = setTimeout(function(){
            if (token === S.narrationToken && S.state === 'playing'){
              show(cue.idx, true);
            }
          }, delay);
          S.cueTimers.push(tid);
        }
      });
    }

    const playPromise = clip.play();
    if (playPromise !== undefined){
      playPromise.catch(function(err){
        if (err && err.name === 'NotAllowedError'){
          $narrationStatus.textContent = 'Audio playback was blocked by browser autoplay policy. Click Play or Next to enable sound.';
          fallback();
        } else {
          fallback();
        }
      });
    }
  } else {
    speakTutor(frame, token, finish);
  }
}

/* ---------- playback state ---------- */
const S = { cfg:null, frames:[], idx:0, state:'paused', timer:0, speed:1300, shown:-1, narration:false, voiceURI:'auto', narrationPending:false, narrationToken:0, currentClip:null, cueTimers:[] };

function tweenDur(f){ return S.state === 'playing' ? Math.max(120, Math.min(600, S.speed * f.hold * 0.5)) : 450; }
function easeProp(get, set, to, animate, f){
  const from = get();
  if (animate && !RM.matches && Math.abs(from - to) > 1e-6){
    tweens.push({ t0:performance.now(), dur:tweenDur(f), upd:function(e){ set(from + (to - from) * e); } });
  } else {
    set(to);
  }
}
function applyScene(f, animate){
  if (!gl || !world) return;
  bars.forEach(function(b){
    let on, hv, text, op, col, gold, green;
    if (b.k === 'w'){
      on = f.shown[b.i]; hv = on ? WORD_H : 0.12; text = on ? f.word[b.i] : '_'; op = on ? 1 : 0.45;
      green = f.status === 'won'; col = green ? RES_COL : BAR_COL; gold = f.hits.indexOf(b.i) >= 0;
    } else {
      on = b.i < f.wrong.length; hv = on ? ATT_H : 0.12; text = on ? f.wrong[b.i] : ''; op = on ? 1 : 0.25;
      green = false; col = HIGH_COL; gold = f.res === 'miss' && b.i === f.wrong.length - 1;
    }
    setText(b.lab, text, { font:SANS, color:C.ink }, 0.5, b.x);
    easeProp(function(){ return b.h; }, function(v){ setH(b, v); }, hv, animate, f);
    b.body.material.opacity = op; b.body.material.color.set(col);
    b.body.material.emissive.set(gold ? '#5a4300' : '#000000');
    b.outline.visible = gold || green; b.outline.material.color.set(gold ? C.accent : RES_DARK);
  });
  if (f.status !== 'playing' || f.kind === 'end'){
    resLabel.position.set(0, dims.maxTop + 0.9, 0);
    setText(resLabel, f.status, { font:SANS, color: f.status === 'won' ? RES_COL : (f.status === 'lost' ? HIGH_COL : C.muted) }, 0.38, 0);
  } else {
    resLabel.visible = false;
  }
  requestRender();
}

function renderCode(f){
  let firstActive = -1;
  rows.forEach(function(r, i){
    const a = f.lines.indexOf(i) >= 0;
    r.classList.toggle('active', a);
    if (a && firstActive < 0) firstActive = i;
  });
  if (firstActive >= 0){
    const r = rows[firstActive];
    if (r.offsetTop < $code.scrollTop) $code.scrollTop = r.offsetTop;
    else if (r.offsetTop + r.offsetHeight > $code.scrollTop + $code.clientHeight) $code.scrollTop = r.offsetTop + r.offsetHeight - $code.clientHeight;
  }
}
function describe(f){
  return 'Hangman word of ' + f.word.length + ' letters shown as ' + f.display + '. Wrong guesses: ' + (f.wrong.length ? f.wrong.join(', ') : 'none') + ' of ' + f.max + '. Status ' + f.status + '.';
}
function updateButtons(){
  const last = S.frames.length - 1;
  $back.disabled = S.idx <= 0;
  $next.disabled = S.idx >= last;
  $play.textContent = S.state === 'playing' ? 'Pause' : (S.idx >= last ? 'Replay' : 'Play');
}
function show(i, animate){
  const f = S.frames[i]; if (!f) return;
  settle();
  S.idx = i;
  $cap.textContent = f.msg;
  $tag.textContent = (f.last ? 'guess "' + f.last + '"' : 'no guess yet') + ' \u00b7 wrong ' + f.wrong.length + '/' + f.max + ' \u00b7 ' + f.status;
  $cv.setAttribute('aria-label', describe(f));
  renderCode(f);
  applyScene(f, animate && Math.abs(i - S.shown) === 1);
  speakFrame(f);
  S.shown = i;
  updateButtons();
}

function clearTimer(){ if (S.timer){ clearTimeout(S.timer); S.timer = 0; } }
function schedule(){
  clearTimer();
  if (S.state !== 'playing' || S.narrationPending) return;
  S.timer = setTimeout(tick, S.speed * S.frames[S.idx].hold);
}
function tick(){
  S.timer = 0;
  if (S.state !== 'playing') return;
  if (S.idx >= S.frames.length - 1){ S.state = 'ended'; updateButtons(); return; }
  show(S.idx + 1, true);
  if (S.idx >= S.frames.length - 1){ S.state = 'ended'; updateButtons(); return; }
  schedule();
}
function pause(){
  clearTimer();
  clearCueTimers();
  if (S.currentClip && !S.currentClip.paused){
    S.currentClip.pause();
  } else {
    cancelNarration();
  }
  settle();
  if (S.state === 'playing' || S.state === 'ended') S.state = 'paused';
  updateButtons();
}
function play(){
  if (S.state === 'playing'){ pause(); return; }
  if (S.idx >= S.frames.length - 1) show(0, false);
  S.state = 'playing'; updateButtons();
  if (S.narration){
    const wt = getActiveWalkthrough(S.cfg);
    if (wt && S.currentClip && S.currentClip.paused && !S.currentClip.ended){
      const token = S.narrationToken;
      const milestone = wt.mapping.find(function(m){ return S.idx >= m.startIdx && S.idx <= m.endIdx; });
      if (milestone){
        clearCueTimers();
        const curTime = S.currentClip.currentTime;
        milestone.cues.forEach(function(cue){
          if (cue.time > curTime){
            const delay = (cue.time - curTime) * 1000;
            const tid = setTimeout(function(){
              if (token === S.narrationToken && S.state === 'playing'){
                show(cue.idx, true);
              }
            }, delay);
            S.cueTimers.push(tid);
          }
        });
      }
      S.narrationPending = true;
      S.currentClip.play().catch(function(){ speakFrame(S.frames[S.idx]); });
    } else {
      speakFrame(S.frames[S.idx]);
    }
  }
  schedule();
}
function step(d){
  cancelNarration();
  pause();
  const j = S.idx + d;
  if (j < 0 || j >= S.frames.length) return;
  show(j, true);
}
function reset(){
  cancelNarration();
  pause();
  show(0, false);
}
function loadInput(word, guesses, max, name){
  cancelNarration();
  pause();
  S.cfg = { name:name, word:word, guesses:guesses, max:max };
  S.frames = simulate(word, guesses, max).frames; S.shown = -1; S.idx = 0;
  $customWord.value = word;
  $customGuesses.value = guesses.join('');
  $customMax.value = String(max);
  build(S.cfg);
  if (S.narration){
    $narrationStatus.textContent = narrationStatusMessage(S.cfg);
  }
  show(0, false);
}
function loadPreset(i){
  const p = PRESETS[i];
  loadInput(p.args[0], p.args[1], p.args[2], p.name);
}

function toggleNarration(){
  if (!narrationAvailable){
    $narrationStatus.textContent = 'Voice narration is unavailable in this environment.';
    return;
  }
  S.narration = !S.narration;
  $narration.textContent = S.narration ? 'Narration: On' : 'Narration: Off';
  $narration.setAttribute('aria-pressed', S.narration ? 'true' : 'false');
  if (S.narration){
    $narrationStatus.textContent = narrationStatusMessage(S.cfg);
    speakFrame(S.frames[S.idx]);
  } else {
    cancelNarration();
    $narrationStatus.textContent = 'Narration muted.';
    if (S.state === 'playing') schedule();
  }
  updateButtons();
}

$back.addEventListener('click', function(){ step(-1); });
$next.addEventListener('click', function(){ step(1); });
$play.addEventListener('click', play);
$reset.addEventListener('click', reset);
$narration.addEventListener('click', toggleNarration);
$voice.addEventListener('change', function(){
  S.voiceURI = $voice.value;
  if (S.narration && !getActiveWalkthrough(S.cfg)) speakFrame(S.frames[S.idx]);
});
$narration.disabled = !narrationAvailable;
if (speechAvailable){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
} else {
  $voice.disabled = true;
}
$preset.addEventListener('change', function(){ loadPreset(Number($preset.value)); });
$customForm.addEventListener('submit', function(e){
  e.preventDefault();
  const word = $customWord.value;
  const rawGuesses = $customGuesses.value;
  const max = Number($customMax.value);
  if (!/^[a-z]{1,12}$/.test(word)){
    $inputStatus.textContent = 'Enter a secret word of 1–12 lowercase English letters.'; $customWord.focus(); return;
  }
  if (!/^[a-z]{0,26}$/.test(rawGuesses)){
    $inputStatus.textContent = 'Enter up to 26 lowercase letters for the guesses, without spaces or separators.'; $customGuesses.focus(); return;
  }
  if (!Number.isInteger(max) || max < 1 || max > 8){
    $inputStatus.textContent = 'Allowed misses must be a whole number from 1 to 8.'; $customMax.focus(); return;
  }
  $inputStatus.textContent = 'Running Hangman for “' + word + '” with ' + max + ' allowed misses.';
  loadInput(word, rawGuesses.split(''), max, 'Your input');
});
$speed.addEventListener('change', function(){
  S.speed = Number($speed.value);
  if (S.state === 'playing') schedule();
});
document.addEventListener('keydown', function(e){
  const t = e.target && e.target.tagName;
  if (t === 'BUTTON' || t === 'SELECT' || t === 'INPUT' || t === 'TEXTAREA') return;
  if (e.key === ' '){ e.preventDefault(); play(); }
  else if (e.key === 'ArrowRight'){ step(1); }
  else if (e.key === 'ArrowLeft'){ step(-1); }
});
document.addEventListener('visibilitychange', function(){ if (document.hidden && S.state === 'playing') pause(); });

if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fitCamera).observe($stage);
else window.addEventListener('resize', fitCamera);

function retheme(){
  if (!gl) return;
  clearTexCache(); readTheme(); build(S.cfg, true); S.shown = -1; show(S.idx, false);
}
try {
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
} catch (e) { /* older browsers: theme refresh on reload */ }
new MutationObserver(retheme).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });

loadPreset(0);
})();
</script>
