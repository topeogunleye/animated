<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pascal's row in 3D: step by step</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#18212b; --muted:#5b6876; --line:#d5dbe3;
  --hl-bg:#fff3bf; --hl-bar:#d99a00; --stage:#eef1f5;
  --plate:#c3ccd7; --accent:#e8a900;
  --btn:#ffffff; --btnHover:#eef1f5;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318; --panel:#171c23; --ink:#e8edf3; --muted:#9aa7b6; --line:#2c3440;
    --hl-bg:#4a3d0a; --hl-bar:#ffc400; --stage:#141a21;
    --plate:#3a4452; --accent:#ffc400;
    --btn:#1d2430; --btnHover:#27303b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#171c23; --ink:#e8edf3; --muted:#9aa7b6; --line:#2c3440;
  --hl-bg:#4a3d0a; --hl-bar:#ffc400; --stage:#141a21;
  --plate:#3a4452; --accent:#ffc400;
  --btn:#1d2430; --btnHover:#27303b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:1120px;margin:0 auto;padding:12px 14px 22px}
h1{font-size:1.15rem;margin:4px 0 12px;font-weight:650}
.wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start;transition:grid-template-columns 180ms ease}
.wrap.code-hidden{grid-template-columns:minmax(0,1fr)}
.wrap.code-hidden .code-pane{display:none}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}}
.stagebox{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:4/3;min-height:260px;max-height:64vh;width:100%}
#cv{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
#cv:active{cursor:grabbing}
.hint{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--muted);pointer-events:none}
.tag{position:absolute;top:8px;left:10px;right:10px;width:max-content;max-width:calc(100% - 20px);font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--panel);border:1px solid var(--line);padding:2px 9px;border-radius:999px}
.err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--ink);background:var(--stage)}
.err[hidden]{display:none}
#caption{margin:12px 2px 10px;min-height:3em;font-size:1rem}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input{font:inherit;font-size:.9rem;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-height:36px}
button{cursor:pointer;min-width:64px}
button:hover:not(:disabled){background:var(--btnHover)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn-tour{background:var(--accent);color:#111;font-weight:700;border:1px solid rgba(0,0,0,0.18);display:inline-flex;align-items:center;gap:6px;padding:6px 14px}
.btn-tour:hover:not(:disabled){filter:brightness(1.08)}
.btn-tour.playing{background:var(--btn);color:var(--ink);border-color:var(--accent)}
.tour-icon{font-size:0.95em}
.btn-mute{min-width:40px;padding:6px 10px;font-size:1rem;display:inline-flex;align-items:center;justify-content:center}
.tour-status{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--muted);min-height:1.6rem;margin:8px 2px 0;padding:4px 10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;width:fit-content;max-width:100%}
.tour-badge{display:inline-block;font-size:0.75rem;font-weight:700;letter-spacing:0.02em;text-transform:uppercase;color:var(--ink);background:var(--bg);padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tour-msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:600px){.tour-status{border-radius:8px;flex-wrap:wrap}.tour-msg{white-space:normal}}
.custom-input{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.custom-input h2{font-size:1rem;margin:0 0 8px}
.input-fields{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.input-fields label{display:grid;gap:4px;color:var(--muted);font-size:.85rem}
.input-fields input{width:min(100%,10rem);min-height:36px;background:var(--bg)}
.input-help,.input-status{margin:7px 0 0;color:var(--muted);font-size:.82rem}
.input-status:not(:empty){min-height:1.2em}
button.active{background:var(--hl-bg);border-color:var(--hl-bar)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#code{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 0;overflow:auto;max-height:70vh;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (max-width:420px){#code{font-size:12px}}
.row{display:flex;min-width:max-content;white-space:pre;padding-right:12px;border-left:4px solid transparent}
.ln{flex:0 0 2.4em;text-align:right;padding-right:12px;color:var(--muted);user-select:none}
.row.active{background:var(--hl-bg);border-left-color:var(--hl-bar)}

/* ---------- top navigation bar ---------- */
.top-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 10px;margin-bottom:10px;border-bottom:1px solid var(--line);font-size:0.875rem}
.top-nav a{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-weight:550;padding:4px 8px;border-radius:6px;transition:background 120ms ease,color 120ms ease}
.top-nav a:hover{background:var(--btnHover);color:var(--accent)}
.top-nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav-back{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.nav-back .nav-arrow{font-size:1.05em;transition:transform 120ms ease}

.nav-sequence{display:inline-flex;align-items:center;gap:6px}
.nav-btn{background:var(--btn);border:1px solid var(--line);padding:3px 9px;border-radius:6px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-size:0.82rem;font-weight:550}
.nav-btn:hover:not(.disabled){background:var(--btnHover);border-color:var(--accent);color:var(--accent)}
.nav-btn.disabled{opacity:0.35;cursor:not-allowed;pointer-events:none}
.nav-indicator{font-size:0.8rem;color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums;user-select:none;font-weight:600}
.nav-arrow{font-size:1em;line-height:1}
@media (max-width:540px){
  .top-nav{flex-wrap:wrap;gap:8px}
  .nav-back span:not(.nav-arrow){font-size:0.82rem}
  .btn-show-code .nav-label{display:none}
  .btn-show-code{padding:3px 8px}
}

/* ---------- collapsible code pane & full-width mode ---------- */
.code-pane{display:flex;flex-direction:column;min-width:0}
.code-header{display:flex;align-items:center;justify-content:space-between;padding:5px 12px;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:12px 12px 0 0;font-size:0.8rem;font-weight:600;color:var(--muted)}
.code-header .code-title{text-transform:uppercase;letter-spacing:0.06em;font-size:0.75rem}
.code-pane #code{border-top-left-radius:0;border-top-right-radius:0}
.btn-toggle-code{background:transparent;border:1px solid transparent;color:var(--muted);padding:2px 8px;border-radius:6px;font:inherit;font-size:0.78rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;min-height:unset;min-width:unset;transition:background 120ms ease,color 120ms ease,border-color 120ms ease}
.btn-toggle-code:hover{background:var(--btnHover);color:var(--ink);border-color:var(--line)}
.btn-toggle-code:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-toggle-code .eye-icon{font-size:1em;line-height:1}
.btn-show-code{display:inline-flex;align-items:center;gap:5px}
.btn-show-code[hidden]{display:none!important}
</style>

<body>
<main>
  <nav class="top-nav" aria-label="Visualizations navigation">
    <a class="nav-back" href="../index.html" title="Return to all algorithm visualizations">
      <span class="nav-arrow" aria-hidden="true">←</span>
      <span>All Visualizations</span>
    </a>
    <div class="nav-sequence">
      <button id="bShowCodeNav" type="button" class="nav-btn btn-show-code" title="Show code panel (C)" aria-label="Show code panel" hidden><span class="eye-icon" aria-hidden="true">👁</span><span class="nav-label">Show Code</span></button>
      <a class="nav-btn prev" href="../07-pascals-triangle/Pascal's%20Triangle%20in%203D,%20step%20by%20step.html" title="Previous visualization: Pascal's Triangle in 3D"><span class="nav-arrow" aria-hidden="true">‹</span><span class="nav-label">Prev</span></a>
      <span class="nav-indicator" aria-label="Visualization 9 of 24" title="Visualization 9 of 24">9 / 24</span>

    </div>
  </nav>
  <h1>Pascal's row (one list) in 3D, step by step</h1>
  <div class="wrap" id="wrap">
    <div>
      <div class="stagebox" id="stage">
        <canvas id="cv" role="img" aria-label="3D list of pillars updated right to left"></canvas>
        <div class="tag" id="tag"></div>
        <div class="hint">drag to rotate · double-click to reset</div>
        <div class="err" id="err" hidden></div>
      </div>
      <p id="caption" role="status" aria-live="polite"></p>
      <div class="controls" role="group" aria-label="Playback controls">
        <button id="bTour" type="button" class="btn-tour" title="Start guided audio tour (Space)">
          <span class="tour-icon" aria-hidden="true">▶</span>
          <span class="tour-label">Audio Tour</span>
        </button>

        <button id="bPlay" type="button" title="Play / Pause (Space)">Play</button>
        <button id="bNext" type="button" title="Next step (Right Arrow)">Next</button>
        <button id="bReset" type="button" title="Reset to start">Reset</button>
        <button id="bMute" type="button" class="btn-mute" title="Mute/unmute voiceover (M)" aria-label="Mute audio">🔊</button>
        <label class="sr" for="preset">Input</label>
        <select id="preset"></select>
        <label class="sr" for="speed">Speed</label>
        <select id="speed">
          <option value="1300">Slow</option>

        </select>
      </div>
      <div id="tourStatus" class="tour-status" hidden>

          <label for="customK">Row index (k)
            <input id="customK" name="k" type="number" value="4" min="0" max="12" step="1" required inputmode="numeric" aria-describedby="inputHelp inputStatus">
          </label>
          <button type="submit">Run my input</button>
        </div>
        <p class="input-help" id="inputHelp">Choose k from 0–12. The one-list method performs k right-to-left passes.</p>
        <p class="input-status" id="inputStatus" role="status" aria-live="polite"></p>

    <div class="code-pane" id="codePane">

        <span class="code-title">Python Code</span>

          <span class="eye-icon" aria-hidden="true">✕</span>

      <div id="code" role="region" aria-label="Python source code"></div>
    </div>

</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* SOURCE:BEGIN */
const SRC = [
  'def pascal_row(k):',
  '    row = [1]',
  '    for r in range(k):',
  '        row.append(0)',
  '        for c in range(r + 1, 0, -1):',
  '            row[c] = row[c] + row[c - 1]',
  '    return row'
];
/* SOURCE:END */

/* PRESETS:BEGIN */
const PRESETS = [
  { name:'k = 4 (row 1 4 6 4 1)', args:[4] },
  { name:'k = 0',                 args:[0] },
  { name:'k = 1',                 args:[1] },
  { name:'k = 7',                 args:[7] }
];
/* PRESETS:END */

/* SIMULATE:BEGIN */
function simulate(k){
  const row = [1], frames = [];
  let r = null, c = null, updates = 0, fin = false;
  function snap(lines, msg, kind, hold){
    frames.push({ lines: lines.slice(), msg: msg, kind: kind, hold: hold, row: row.slice(), r: r, c: c, updates: updates, fin: fin, k: k });
  }
  snap([], 'Key idea: one list is enough. Update it right to left, so row[c - 1] still holds the old value.', 'start', 1);
  snap([1], 'row = [1] is row 0. We need ' + k + ' pass' + (k === 1 ? '' : 'es') + ' to reach row ' + k + '.', 'init', 1);
  for (let i = 0; i < k; i++){
    r = i; c = null;
    row.push(0);
    snap([2, 3], 'Pass ' + (i + 1) + ': row holds row ' + i + '. Append 0 to make room for row ' + (i + 1) + '.', 'enter', 1);
    for (let j = i + 1; j >= 1; j--){
      c = j;
      const a = row[j], b = row[j - 1];
      row[j] = a + b; updates += 1;
      snap([4, 5], 'row[' + j + '] = ' + a + ' + ' + b + ' = ' + (a + b) + ' (old row[' + j + '] plus row[' + (j - 1) + ']).', 'step', 1.3);
    }
    c = null;
  }
  r = null; c = null;
  snap([2], k === 0 ? 'range(0) is empty: no pass runs and row stays [1].' : 'range(k) is used up: row is now row ' + k + '.', 'step', 1);
  fin = true;
  snap([6], 'Return [' + row.join(', ') + ']: row ' + k + ', built with one list and ' + updates + ' update' + (updates === 1 ? '' : 's') + '.', 'end', 1);
  return { frames: frames, result: row.slice() };
}
/* SIMULATE:END */

/* ---------- DOM ---------- */
const $ = function(id){ return document.getElementById(id); };
const $cv = $('cv'), $stage = $('stage'), $cap = $('caption'), $tag = $('tag'), $err = $('err'), $code = $('code');
const $wrap = $('wrap'), $codePane = $('codePane'), $bHideCode = $('bHideCode'), $bShowCodeNav = $('bShowCodeNav');
const $tour = $('bTour'), $back = $('bBack'), $play = $('bPlay'), $next = $('bNext'), $reset = $('bReset'), $mute = $('bMute');
const $preset = $('preset'), $speed = $('speed');
const $tourStatus = $('tourStatus'), $tourBadge = $('tourBadge'), $tourMsg = $('tourMsg');
const $customForm = $('customForm'), $customK = $('customK'), $inputStatus = $('inputStatus');
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches:false };

function toggleCodePane(collapsed){
  const willHide = (collapsed !== undefined) ? collapsed : !$wrap.classList.contains('code-hidden');
  $wrap.classList.toggle('code-hidden', willHide);
  if ($bShowCodeNav) $bShowCodeNav.hidden = !willHide;
  if (willHide && $bShowCodeNav) {
    try { $bShowCodeNav.focus(); } catch(e){}
  } else if (!willHide && $bHideCode) {
    try { $bHideCode.focus(); } catch(e){}
  }
}
if ($bHideCode) $bHideCode.addEventListener('click', function(){ toggleCodePane(true); });
if ($bShowCodeNav) $bShowCodeNav.addEventListener('click', function(){ toggleCodePane(false); });

const rows = SRC.map(function(txt, i){
  const r = document.createElement('div'); r.className = 'row';
  const n = document.createElement('span'); n.className = 'ln'; n.textContent = String(i + 1);
  const c = document.createElement('span'); c.textContent = txt;
  r.appendChild(n); r.appendChild(c); $code.appendChild(r);
  return r;
});
PRESETS.forEach(function(p, i){
  const o = document.createElement('option'); o.value = String(i); o.textContent = p.name; $preset.appendChild(o);
});

/* ---------- three.js scene (perspective 3D) ---------- */
const SP = 1.0, BAR_W = 0.78, BAR_COL = '#3b82c4', RES_COL = '#2e9e5b', RES_DARK = '#16683a';
const LOW_COL = '#2563a8', HIGH_COL = '#c46a14', MID_COL = '#e8a900';
const LOW_Z = 1.2, HIGH_Z = 2.2, FLOOR_Z0 = -0.8, FLOOR_Z1 = 2.9, FOCUS_Z = (FLOOR_Z0 + FLOOR_Z1) / 2;
const YAW0 = -0.22, PITCH0 = 0.46, YAW_MAX = 0.55, FOV = 32;
let gl = false, renderer = null, scene = null, camera = null;
let world = null, bars = [], vals = [], ptr = {}, slab = null, resLabel = null, emptyLabel = null;
let dims = { halfW:7, halfY:3, ty:2, maxTop:3, scale:1 };
const view = { yaw:YAW0, pitch:PITCH0, dist:20 };
const C = {};
const texCache = new Map();
const tweens = [];
let raf = 0, drag = null;

function showError(msg){ $err.hidden = false; $err.textContent = msg; }
function readTheme(){
  const cs = getComputedStyle(document.documentElement);
  ['ink','muted','plate','accent'].forEach(function(k){ C[k] = cs.getPropertyValue('--' + k).trim() || '#888888'; });
}
try {
  if (typeof THREE === 'undefined') throw new Error('three.js did not load');
  renderer = new THREE.WebGLRenderer({ canvas:$cv, antialias:true, alpha:true });
  renderer.setClearColor(0x000000, 0);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 4 / 3, 0.1, 200);
  scene.add(new THREE.AmbientLight(0xffffff, 0.58));
  const dl = new THREE.DirectionalLight(0xffffff, 0.85); dl.position.set(-5, 10, 8); scene.add(dl);
  gl = true;
} catch (e) {
  showError('The 3D view could not start (' + (e && e.message ? e.message : 'WebGL unavailable') + '). Check your connection or browser WebGL support. The code panel and captions still step through the trace.');
}

function textTex(text, style){
  const key = text + '|' + style.color + '|' + style.font;
  let t = texCache.get(key);
  if (t) return t;
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
  ctx.font = style.font;
  const w = Math.max(24, Math.ceil(ctx.measureText(text).width) + 16), h = 64;
  cv.width = w; cv.height = h;
  ctx.font = style.font; ctx.fillStyle = style.color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, w / 2, h / 2 + 2);
  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  t = { tex:tex, aspect:w / h };
  texCache.set(key, t);
  return t;
}
function clearTexCache(){ texCache.forEach(function(t){ t.tex.dispose(); }); texCache.clear(); }
function makeSprite(){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ transparent:true, depthTest:false }));
  s.renderOrder = 10; s.visible = false; return s;
}
function setText(s, text, style, worldH, x){
  if (!text){ s.visible = false; return; }
  const t = textTex(text, style);
  s.material.map = t.tex; s.material.needsUpdate = true;
  s.scale.set(worldH * t.aspect, worldH, 1);
  if (x !== undefined) s.position.x = x;
  s.visible = true;
}
const SANS = '700 48px system-ui, -apple-system, "Segoe UI", sans-serif';
function slotX(i, n){ return (i - (n - 1) / 2) * SP; }
function barH(v){ return Math.max(v * dims.scale, 0.12); }

function clearWorld(){
  tweens.length = 0;
  if (!world) return;
  world.traverse(function(o){
    if (o.geometry) o.geometry.dispose();
    if (o.material) o.material.dispose();
  });
  scene.remove(world); world = null; bars = []; vals = []; ptr = {}; slab = null; resLabel = null; emptyLabel = null;
}

function makePointer(name, color, up, coneY, labelY, z){
  const g = new THREE.Group();
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 20), new THREE.MeshLambertMaterial({ color:color }));
  cone.position.y = coneY;
  if (!up) cone.rotation.z = Math.PI;
  const lab = makeSprite(); lab.position.y = labelY;
  setText(lab, name, { font:SANS, color:color }, 0.4, 0);
  g.add(cone); g.add(lab); g.position.z = z; g.visible = false;
  return g;
}

function setH(b, hv){
  b.h = hv; b.body.scale.y = hv; b.body.position.y = hv / 2;
  b.outline.scale.y = hv + 0.14; b.outline.position.y = hv / 2; b.lab.position.y = hv + 0.32;
}
function build(cfg, keepView){
  if (!gl) return;
  clearWorld(); readTheme();
  world = new THREE.Group(); scene.add(world);
  const n = cfg.k + 1;
  let maxV = 1; cfg.final.forEach(function(v){ maxV = Math.max(maxV, v); });
  dims.scale = 3 / maxV; dims.maxTop = 3; dims.halfW = (n + 2) * SP / 2 + 0.7; dims.halfY = 2.8; dims.ty = 2.6;
  const floor = new THREE.Mesh(new THREE.BoxGeometry(n * SP + 0.9, 0.14, FLOOR_Z1 - FLOOR_Z0), new THREE.MeshLambertMaterial({ color:C.plate }));
  floor.position.set(0, -0.07, FOCUS_Z); world.add(floor);
  for (let i = 0; i < n; i++){
    const x = slotX(i, n);
    const body = new THREE.Mesh(new THREE.BoxGeometry(BAR_W, 1, BAR_W), new THREE.MeshLambertMaterial({ color:BAR_COL }));
    const outline = new THREE.Mesh(new THREE.BoxGeometry(BAR_W + 0.14, 1, BAR_W + 0.14), new THREE.MeshBasicMaterial({ color:C.accent, side:THREE.BackSide }));

    body.position.x = x; outline.position.x = x; body.visible = false; outline.visible = false;
    world.add(outline); world.add(body); world.add(lab);
    const b = { body:body, outline:outline, lab:lab, h:0.12 }; setH(b, 0.12); bars.push(b);
    const idx = makeSprite(); idx.position.set(x, 0.3, 0.98);
    setText(idx, String(i), { font:SANS, color:C.muted }, 0.34, x); world.add(idx);
  }
  ptr.low = makePointer('c', LOW_COL, true, 0.28, 0.95, LOW_Z);
  ptr.high = makePointer('c-1', HIGH_COL, true, 0.28, 0.95, HIGH_Z);
  [ptr.low, ptr.high].forEach(function(g){ world.add(g); });
  slab = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color:BAR_COL, transparent:true, opacity:0.12, depthWrite:false }));
  slab.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)), new THREE.LineBasicMaterial({ color:C.accent })));

}

function updateCamera(){
  if (!gl) return;
  const cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  camera.position.set(Math.sin(view.yaw) * cp * view.dist, dims.ty + sp * view.dist, FOCUS_Z + Math.cos(view.yaw) * cp * view.dist);
  camera.lookAt(0, dims.ty, FOCUS_Z);
  requestRender();
}
function fitCamera(){
  if (!gl) return;
  const w = $stage.clientWidth, h = $stage.clientHeight;
  if (!w || !h) return;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  const aspect = w / h, t = Math.tan(FOV * Math.PI / 360), halfZ = (FLOOR_Z1 - FLOOR_Z0) / 2;
  camera.aspect = aspect; camera.updateProjectionMatrix();
  const vExt = dims.halfY * Math.cos(PITCH0) + halfZ * Math.sin(PITCH0);
  const hExt = dims.halfW * Math.cos(YAW_MAX) + halfZ * Math.sin(YAW_MAX);
  view.dist = Math.max(vExt / t, hExt / (t * aspect)) * 1.2;
  updateCamera();
}

/* ---------- tweens and render loop ---------- */
function settle(){ tweens.splice(0).forEach(function(tw){ tw.upd(1); }); }
function requestRender(){ if (gl && !raf) raf = requestAnimationFrame(loop); }
function loop(){
  raf = 0;
  const now = performance.now();
  for (let i = tweens.length - 1; i >= 0; i--){
    const tw = tweens[i];
    const u = Math.max(0, Math.min(1, (now - tw.t0) / tw.dur));
    tw.upd(u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
    if (u >= 1) tweens.splice(i, 1);
  }
  renderer.render(scene, camera);
  if (tweens.length) requestRender();
}

/* drag left or right to turn the scene; double-click resets the view */
if (gl){
  $cv.addEventListener('pointerdown', function(e){
    drag = { x:e.clientX, yaw:view.yaw };
    try { $cv.setPointerCapture(e.pointerId); } catch (err) { /* not needed for the drag to work */ }
  });
  $cv.addEventListener('pointermove', function(e){
    if (!drag) return;
    view.yaw = Math.max(-YAW_MAX, Math.min(YAW_MAX, drag.yaw + (e.clientX - drag.x) * 0.008));
    updateCamera();
  });
  ['pointerup', 'pointercancel'].forEach(function(t){ $cv.addEventListener(t, function(){ drag = null; }); });
  $cv.addEventListener('dblclick', function(){ view.yaw = YAW0; view.pitch = PITCH0; updateCamera(); });
}

function getActiveWalkthrough(cfg){
  if (!cfg) return null;
  const keys = Object.keys(WALKTHROUGHS);
  for (let i = 0; i < keys.length; i++){
    const wt = WALKTHROUGHS[keys[i]];
    if (wt.match(cfg)) return wt;
  }
  return null;
}

function getMilestones(wt){
  if (!wt) return [];
  return wt.milestones || [];
}

function getMilestoneTitle(wt, mIdx){
  const milestones = getMilestones(wt);
  const m = milestones[mIdx];
  if (!m) return '';
  return m.title || ('Milestone ' + (mIdx + 1));
}

function getMilestoneClip(wt, m){
  if (!m) return null;
  if (typeof m.clip === 'string' && wt.clips){
    return wt.clips[m.clip] || null;
  }
  return m.clip || null;
}

/* ---------- playback state ---------- */
const S = {
  cfg: null,
  frames: [],
  idx: 0,
  state: 'paused',
  timer: 0,
  speed: 1300,
  shown: -1,
  audioMuted: false,
  currentClip: null,
  currentMilestoneIdx: -1,
  cueTimers: [],
  tourToken: 0
};

function clearCueTimers(){
  while (S.cueTimers.length > 0){
    clearTimeout(S.cueTimers.pop());
  }
}

function stopAudio(){
  clearCueTimers();
  if (S.currentClip){
    try {
      S.currentClip.pause();
      S.currentClip.currentTime = 0;
    } catch(e){}
    S.currentClip = null;
  }
  S.currentMilestoneIdx = -1;
}

function pauseAudio(){
  clearCueTimers();
  if (S.currentClip){
    try { S.currentClip.pause(); } catch(e){}
  }
}

function updateMuteButton(){
  $mute.textContent = S.audioMuted ? '🔇' : '🔊';
  $mute.title = S.audioMuted ? 'Unmute voiceover (M)' : 'Mute voiceover (M)';
  $mute.setAttribute('aria-label', S.audioMuted ? 'Unmute audio' : 'Mute audio');
}

function updateTourStatus(){
  const wt = getActiveWalkthrough(S.cfg);
  if (!wt){
    $tourStatus.hidden = true;
    return;
  }
  $tourStatus.hidden = false;
  const milestones = getMilestones(wt);
  let curM = -1;
  for (let i = 0; i < milestones.length; i++){
    if (S.idx >= milestones[i].startIdx && S.idx <= milestones[i].endIdx){
      curM = i;
      break;
    }
  }
  if (curM >= 0){
    $tourBadge.textContent = 'Milestone ' + (curM + 1) + '/' + milestones.length;
    $tourMsg.textContent = milestones[curM].title + (S.audioMuted ? ' (muted)' : '');
  } else {
    $tourBadge.textContent = 'Tour';
    $tourMsg.textContent = wt.name;
  }
}

function startMilestone(mIdx, fromTime){
  const wt = getActiveWalkthrough(S.cfg);
  if (!wt || !audioAvailable || S.audioMuted) return;

  const milestones = getMilestones(wt);
  if (mIdx < 0 || mIdx >= milestones.length) return;

  const m = milestones[mIdx];
  const clip = getMilestoneClip(wt, m);
  if (!clip){
    if (S.state === 'playing') schedule();
    return;
  }

  S.currentMilestoneIdx = mIdx;
  S.currentClip = clip;
  const token = ++S.tourToken;
  updateTourStatus();

  clip.onended = function(){
    if (token !== S.tourToken || S.state !== 'playing') return;
    if (mIdx + 1 < milestones.length){
      startMilestone(mIdx + 1, 0);
    } else {
      S.state = 'ended';
      S.currentClip = null;
      updateButtons();
      updateTourStatus();
    }
  };

  clip.onerror = function(){
    if (token !== S.tourToken) return;
    console.warn('Audio clip failed to play, switching to silent mode.');
    $tourMsg.textContent = 'Audio clips unavailable; running in silent mode.';
    S.audioMuted = true;
    updateMuteButton();
    if (S.state === 'playing') schedule();
  };

  try {
    clip.currentTime = fromTime || 0;
  } catch(e){}

  clearCueTimers();
  if (Array.isArray(m.cues)){
    m.cues.forEach(function(cue){
      const cueTime = cue.time || 0;
      const targetFrame = cue.frameIdx !== undefined ? cue.frameIdx : cue.idx;
      if (cueTime >= (fromTime || 0)){
        const delayMs = Math.max(0, (cueTime - (fromTime || 0)) * 1000);
        const timerId = setTimeout(function(){
          if (token === S.tourToken && S.state === 'playing'){
            show(targetFrame, true);
          }
        }, delayMs);
        S.cueTimers.push(timerId);
      }
    });
  }

  const playPromise = clip.play();
  if (playPromise !== undefined){
    playPromise.catch(function(err){
      if (token !== S.tourToken) return;
      if (err && err.name === 'NotAllowedError'){
        $tourMsg.textContent = 'Click Audio Tour to allow sound in your browser.';
      } else {
        $tourMsg.textContent = 'Audio clips unavailable; running in silent mode.';
      }
      if (S.state === 'playing') schedule();
    });
  }
}

function playMilestoneForFrame(frameIdx){
  const wt = getActiveWalkthrough(S.cfg);
  if (!wt || !audioAvailable || S.audioMuted) return;

  const milestones = getMilestones(wt);
  let mIdx = -1;
  for (let i = 0; i < milestones.length; i++){
    const m = milestones[i];
    if (frameIdx >= m.startIdx && frameIdx <= m.endIdx){
      mIdx = i;
      break;
    }
  }
  if (mIdx < 0) return;

  const m = milestones[mIdx];
  const clip = getMilestoneClip(wt, m);
  let fromTime = 0;
  if (Array.isArray(m.cues)){
    for (let c = m.cues.length - 1; c >= 0; c--){
      const fIdx = m.cues[c].frameIdx !== undefined ? m.cues[c].frameIdx : m.cues[c].idx;
      if (frameIdx >= fIdx){
        fromTime = m.cues[c].time || 0;
        break;
      }
    }
  }

  if (S.currentClip === clip && !clip.ended && clip.currentTime > fromTime){
    fromTime = clip.currentTime;
  }

  startMilestone(mIdx, fromTime);
}

function tweenDur(f){ return S.state === 'playing' ? Math.max(120, Math.min(600, S.speed * f.hold * 0.5)) : 450; }
function easeProp(get, set, to, animate, f){
  const from = get();
  if (animate && !RM.matches && Math.abs(from - to) > 1e-6){
    tweens.push({ t0:performance.now(), dur:tweenDur(f), upd:function(e){ set(from + (to - from) * e); } });
  } else {
    set(to);
  }
}
function applyScene(f, animate){
  if (!gl || !world) return;
  const n = S.cfg.k + 1;
  const wasVisible = { low:ptr.low.visible, high:ptr.high.visible };
  [['low', f.c], ['high', f.c === null ? null : f.c - 1]].forEach(function(p){
    const g = ptr[p[0]];
    if (p[1] === null){ g.visible = false; return; }
    const x = slotX(p[1], n);
    if (!wasVisible[p[0]]) g.position.x = x;
    g.visible = true;
    easeProp(function(){ return g.position.x; }, function(v){ g.position.x = v; }, x, animate && wasVisible[p[0]], f);
  });
  if (f.c !== null){
    const cx = (slotX(0, n) + slotX(f.c, n)) / 2, w = (f.c + 1) * SP + 0.08, y0 = -0.05, y1 = dims.maxTop + 0.55, was = slab.visible;
    slab.visible = true; slab.scale.y = y1 - y0; slab.scale.z = 1.5; slab.position.y = (y0 + y1) / 2;
    if (!was){ slab.position.x = cx; slab.scale.x = w; }
    easeProp(function(){ return slab.position.x; }, function(v){ slab.position.x = v; }, cx, animate && was, f);
    easeProp(function(){ return slab.scale.x; }, function(v){ slab.scale.x = v; }, w, animate && was, f);
  } else {
    slab.visible = false;
  }
  bars.forEach(function(b, i){
    const known = i < f.row.length, was = b.body.visible;
    b.body.visible = known; b.lab.visible = known;
    if (!known){ b.outline.visible = false; return; }
    const hv = Math.max(f.row[i] * dims.scale, 0.12);
    setText(b.lab, String(f.row[i]), { font:SANS, color:C.ink }, 0.5, slotX(i, n));
    easeProp(function(){ return b.h; }, function(v){ setH(b, v); }, hv, animate && was, f);
    const isW = f.c === i, isSrc = f.c !== null && i === f.c - 1;
    b.body.material.color.set(isW || f.fin ? RES_COL : BAR_COL);
    b.body.material.emissive.set(isSrc ? '#5a4300' : '#000000');
    b.outline.visible = isW || isSrc || f.fin;
    b.outline.material.color.set(isSrc ? C.accent : RES_DARK);
  });
  if (f.fin){
    resLabel.position.set(0, dims.maxTop + 0.9, 0);
    setText(resLabel, 'result', { font:SANS, color:RES_COL }, 0.38, 0);
  } else {
    resLabel.visible = false;
  }
  requestRender();
}

function renderCode(f){
  let firstActive = -1;
  rows.forEach(function(r, i){
    const a = f.lines.indexOf(i) >= 0;
    r.classList.toggle('active', a);
    if (a && firstActive < 0) firstActive = i;
  });
  if (firstActive >= 0){
    const r = rows[firstActive];
    if (r.offsetTop < $code.scrollTop) $code.scrollTop = r.offsetTop;
    else if (r.offsetTop + r.offsetHeight > $code.scrollTop + $code.clientHeight) $code.scrollTop = r.offsetTop + r.offsetHeight - $code.clientHeight;
  }
}
function describe(f){
  return 'Single list [' + f.row.join(', ') + '] while building row ' + f.k + '. ' + f.updates + ' updates so far.';
}
function updateButtons(){
  const last = S.frames.length - 1;
  $back.disabled = S.idx <= 0;
  $next.disabled = S.idx >= last;
  $play.textContent = S.state === 'playing' ? 'Pause' : (S.idx >= last ? 'Replay' : 'Play');

  const isTourPlaying = S.state === 'playing';
  $tour.classList.toggle('playing', isTourPlaying);
  const lbl = $tour.querySelector('.tour-label');
  if (lbl){
    lbl.textContent = isTourPlaying ? 'Pause' : (S.idx >= last ? 'Replay' : 'Audio Tour');
  }
  const icn = $tour.querySelector('.tour-icon');
  if (icn){
    icn.textContent = isTourPlaying ? '⏸' : '▶';
  }
}
function show(i, animate){
  const f = S.frames[i]; if (!f) return;
  settle();
  S.idx = i;
  $cap.textContent = f.msg;
  $tag.textContent = 'k = ' + f.k + ' \u00b7 list length ' + f.row.length + ' \u00b7 updates ' + f.updates;
  $cv.setAttribute('aria-label', describe(f));
  renderCode(f);
  applyScene(f, animate && Math.abs(i - S.shown) === 1);
  S.shown = i;
  updateButtons();
  updateTourStatus();
}

function clearTimer(){ if (S.timer){ clearTimeout(S.timer); S.timer = 0; } }
function schedule(){
  clearTimer();
  if (S.state !== 'playing') return;
  const wt = getActiveWalkthrough(S.cfg);
  if (wt && audioAvailable && !S.audioMuted && S.currentClip && !S.currentClip.paused){
    return;
  }
  S.timer = setTimeout(tick, S.speed * S.frames[S.idx].hold);
}
function tick(){
  S.timer = 0;
  if (S.state !== 'playing') return;
  if (S.idx >= S.frames.length - 1){ S.state = 'ended'; updateButtons(); updateTourStatus(); return; }
  show(S.idx + 1, true);
  if (S.idx >= S.frames.length - 1){ S.state = 'ended'; updateButtons(); updateTourStatus(); return; }
  schedule();
}
function pause(){
  clearTimer();
  settle();
  pauseAudio();
  if (S.state === 'playing' || S.state === 'ended') S.state = 'paused';
  updateButtons();
  updateTourStatus();
}
function play(){
  if (S.state === 'playing'){ pause(); return; }
  if (S.idx >= S.frames.length - 1) show(0, false);
  S.state = 'playing'; updateButtons();
  const wt = getActiveWalkthrough(S.cfg);
  if (wt && audioAvailable && !S.audioMuted){
    playMilestoneForFrame(S.idx);
  } else {
    updateTourStatus();
    schedule();
  }
}
function step(d){
  stopAudio();
  pause();
  const j = S.idx + d;
  if (j < 0 || j >= S.frames.length) return;
  show(j, true);
}
function reset(){
  stopAudio();
  pause();
  show(0, false);
}
function toggleMute(){
  S.audioMuted = !S.audioMuted;
  updateMuteButton();
  if (S.audioMuted){
    pauseAudio();
    if (S.state === 'playing') schedule();
  } else {
    clearTimer();
    if (S.state === 'playing') playMilestoneForFrame(S.idx);
  }
  updateTourStatus();
}
function loadInput(k, name){
  stopAudio();
  pause();
  const sim = simulate(k);
  S.cfg = { name:name, k:k, final:sim.result };
  S.frames = sim.frames; S.shown = -1; S.idx = 0;
  $customK.value = String(k);
  build(S.cfg);
  show(0, false);
  updateTourStatus();
}
function loadPreset(i){
  $preset.value = String(i);
  const p = PRESETS[i];
  loadInput(p.args[0], p.name);
}

$tour.addEventListener('click', play);
$mute.addEventListener('click', toggleMute);
$back.addEventListener('click', function(){ step(-1); });
$next.addEventListener('click', function(){ step(1); });
$play.addEventListener('click', play);
$reset.addEventListener('click', reset);
$preset.addEventListener('change', function(){ loadPreset(Number($preset.value)); });
$customForm.addEventListener('submit', function(e){
  e.preventDefault();
  const k = Number($customK.value);
  if (!Number.isInteger(k) || k < 0 || k > 12){
    $inputStatus.textContent = 'Enter a whole number from 0 to 12.'; $customK.focus(); return;
  }
  $inputStatus.textContent = 'Running the one-list calculation for row k = ' + k + '.';
  loadInput(k, 'Your input');
});
$speed.addEventListener('change', function(){
  S.speed = Number($speed.value);
  if (S.state === 'playing') schedule();
});
document.addEventListener('keydown', function(e){
  const t = e.target && e.target.tagName;
  if (t === 'BUTTON' || t === 'SELECT' || t === 'INPUT' || t === 'TEXTAREA') return;
  if (e.key === ' '){ e.preventDefault(); play(); }
  else if (e.key === 'ArrowRight'){ step(1); }
  else if (e.key === 'ArrowLeft'){ step(-1); }
  else if (e.key === 'c' || e.key === 'C'){ e.preventDefault(); toggleCodePane(); }
  else if (e.key === 'm' || e.key === 'M'){ e.preventDefault(); toggleMute(); }
});
document.addEventListener('visibilitychange', function(){ if (document.hidden && S.state === 'playing') pause(); });

if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fitCamera).observe($stage);
else window.addEventListener('resize', fitCamera);

function retheme(){
  if (!gl) return;
  clearTexCache(); readTheme(); build(S.cfg, true); S.shown = -1; show(S.idx, false);
}
try {
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
} catch (e) { /* older browsers: theme refresh on reload */ }
new MutationObserver(retheme).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });

loadPreset(0);
})();
</script>
</body>
</html>
