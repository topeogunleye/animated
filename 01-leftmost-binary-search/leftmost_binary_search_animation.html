<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leftmost binary search in 3D: step by step</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#18212b; --muted:#5b6876; --line:#d5dbe3;
  --hl-bg:#fff3bf; --hl-bar:#d99a00; --stage:#eef1f5;
  --plate:#c3ccd7; --accent:#e8a900;
  --btn:#ffffff; --btnHover:#eef1f5;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318; --panel:#171c23; --ink:#e8edf3; --muted:#9aa7b6; --line:#2c3440;
    --hl-bg:#4a3d0a; --hl-bar:#ffc400; --stage:#141a21;
    --plate:#3a4452; --accent:#ffc400;
    --btn:#1d2430; --btnHover:#27303b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#171c23; --ink:#e8edf3; --muted:#9aa7b6; --line:#2c3440;
  --hl-bg:#4a3d0a; --hl-bar:#ffc400; --stage:#141a21;
  --plate:#3a4452; --accent:#ffc400;
  --btn:#1d2430; --btnHover:#27303b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:1120px;margin:0 auto;padding:12px 14px 22px}
h1{font-size:1.15rem;margin:4px 0 12px;font-weight:650}
.wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}}
.stagebox{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:4/3;min-height:260px;max-height:64vh;width:100%}
#cv{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
#cv:active{cursor:grabbing}
.hint{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--muted);pointer-events:none}
.tag{position:absolute;top:8px;left:10px;right:10px;width:max-content;max-width:calc(100% - 20px);font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--panel);border:1px solid var(--line);padding:2px 9px;border-radius:999px}
.err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--ink);background:var(--stage)}
.err[hidden]{display:none}
#caption{margin:12px 2px 10px;min-height:3em;font-size:1rem}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls label{font-size:.85rem;color:var(--muted)}
button,select{font:inherit;font-size:.9rem;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-height:36px}
button{cursor:pointer;min-width:64px}
button:hover:not(:disabled){background:var(--btnHover)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.custom-input{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.custom-input h2{font-size:1rem;margin:0 0 8px}
.input-fields{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.input-fields label{display:grid;gap:4px;color:var(--muted);font-size:.85rem}
.input-fields input{width:min(100%,26rem);min-height:36px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
.input-help,.input-status{margin:7px 0 0;color:var(--muted);font-size:.82rem}
.input-status:not(:empty){min-height:1.2em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#code{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 0;overflow:auto;max-height:70vh;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (max-width:420px){#code{font-size:12px}}
.row{display:flex;min-width:max-content;white-space:pre;padding-right:12px;border-left:4px solid transparent}
.ln{flex:0 0 2.4em;text-align:right;padding-right:12px;color:var(--muted);user-select:none}
.row.active{background:var(--hl-bg);border-left-color:var(--hl-bar)}
</style>
</head>
<body>
<main>
  <h1>Leftmost binary search in 3D, step by step</h1>
  <div class="wrap">
    <div>
      <div class="stagebox" id="stage">
        <canvas id="cv" role="img" aria-label="3D sorted list with low, mid and high pointers"></canvas>
        <div class="tag" id="tag"></div>
        <div class="hint">drag to rotate · double-click to reset</div>
        <div class="err" id="err" hidden></div>
      </div>
      <p id="caption" role="status" aria-live="polite"></p>
      <div class="controls" role="group" aria-label="Playback controls">
        <button id="bBack" type="button">Back</button>
        <button id="bPlay" type="button">Play</button>
        <button id="bNext" type="button">Next</button>
        <button id="bReset" type="button">Reset</button>
        <button id="bNarration" type="button" aria-pressed="false" aria-describedby="narrationStatus">Narration: Off</button>
        <label class="sr" for="preset">Input</label>
        <select id="preset"></select>
        <label class="sr" for="speed">Speed</label>
        <select id="speed">
          <option value="1300">Slow</option>
          <option value="850">Normal</option>
          <option value="450">Fast</option>
          <option value="220">Very fast</option>
        </select>
        <label for="voice">Voice</label>
        <select id="voice" aria-label="Narration voice">
          <option value="auto">Automatic (prefer natural English)</option>
        </select>
      </div>
      <p class="input-status" id="narrationStatus" role="status" aria-live="polite"></p>
      <form class="custom-input" id="customForm">
        <h2>Play with your own input</h2>
        <div class="input-fields">
          <label for="customNums">Sorted numbers, comma-separated
            <input id="customNums" name="nums" type="text" value="1, 3, 3, 3, 5, 8" autocomplete="off" spellcheck="false" aria-describedby="inputHelp inputStatus">
          </label>
          <label for="customTarget">Target
            <input id="customTarget" name="target" type="number" value="3" step="1" required inputmode="numeric" aria-describedby="inputHelp inputStatus">
          </label>
          <button type="submit">Run my input</button>
        </div>
        <p class="input-help" id="inputHelp">Enter 0–16 integers from −1,000 to 1,000 in non-decreasing order. An empty list is allowed.</p>
        <p class="input-status" id="inputStatus" role="status" aria-live="polite"></p>
      </form>
    </div>
    <div id="code" role="region" aria-label="Python source code"></div>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- displayed source (0-based index here, 1-based in the panel) ---------- */
const CODE = [
  'def binary_search(nums, target):',        // 0
  '    low, high = 0, len(nums) - 1',        // 1
  '    comparisons = 0',                     // 2
  '    result = -1',                         // 3
  '    while low <= high:',                  // 4
  '        mid = (low + high) // 2',         // 5
  '        comparisons += 1',                // 6
  '        if nums[mid] == target:',         // 7
  '            result = mid',                // 8
  '            high = mid - 1',              // 9
  '        elif nums[mid] < target:',        // 10
  '            low = mid + 1',               // 11
  '        else:',                           // 12
  '            high = mid - 1',              // 13
  '    return result, comparisons'           // 14
];

const PRESETS = [
  { name:'Duplicate 3s',         nums:[1,3,3,3,5,8],                target:3 },
  { name:'Target missing (4)',   nums:[1,3,5,8],                     target:4 },
  { name:'Empty list',           nums:[],                            target:7 },
  { name:'All equal (7 x 5)',    nums:[7,7,7,7,7],                   target:7 },
  { name:'Ten items, four 4s',   nums:[1,2,2,4,4,4,4,6,9,11],        target:4 }
];

/*SIM_START*/
function simulate(cfg){
  const nums = cfg.nums, target = cfg.target, n = nums.length;
  const frames = [];
  let low = null, high = null, mid = null, comps = 0, result = -1, cmp = null;

  function snap(lines, msg, kind, hold){
    frames.push({ lines: lines.slice(), msg: msg, kind: kind, hold: hold,
      low: low, high: high, mid: mid, comps: comps, result: result, cmp: cmp, target: target });
  }
  const plural = function(k){ return k + ' comparison' + (k === 1 ? '' : 's'); };

  snap([], 'Key idea: on a match, keep the index but search left. The leftmost match can only be at or before it.', 'start', 1);
  low = 0; high = n - 1;
  snap([0, 1, 2, 3], 'Start with low = 0, high = ' + (n - 1) + ', no comparisons yet, and result = \u22121.', 'init', 1);

  while (low <= high){
    mid = Math.floor((low + high) / 2);
    cmp = null;
    snap([4, 5], 'low ' + low + ' \u2264 high ' + high + ', so mid = (' + low + ' + ' + high + ') // 2 = ' + mid + '.', 'pick', 1);
    comps += 1;
    const v = nums[mid];
    const head = 'Compare nums[' + mid + '] = ' + v + ' with ' + target + ' (comparison ' + comps + '): ';
    if (v === target){
      result = mid; high = mid - 1; cmp = 'eq';
      snap([6, 7, 8, 9], head + 'equal. Keep result = ' + mid + ', then search left: high = ' + high + '.', 'step', 1.6);
    } else if (v < target){
      low = mid + 1; cmp = 'lt';
      snap([6, 7, 10, 11], head + 'too small, so drop the left half: low = ' + low + '.', 'step', 1.6);
    } else {
      high = mid - 1; cmp = 'gt';
      snap([6, 7, 10, 12, 13], head + 'too big, so drop the right half: high = ' + high + '.', 'step', 1.6);
    }
  }
  mid = null; cmp = null;
  snap([4], 'low ' + low + ' > high ' + high + ': no range left, so the loop stops.', 'step', 1);
  snap([14], result >= 0
    ? 'Return (' + result + ', ' + comps + '): the leftmost ' + target + ' is at index ' + result + ', found with ' + plural(comps) + '.'
    : 'Return (\u22121, ' + comps + '): ' + target + ' is not in the list (' + plural(comps) + ').', 'end', 1);
  return { frames: frames, result: [result, comps] };
}
/*SIM_END*/

/* ---------- DOM ---------- */
const $ = function(id){ return document.getElementById(id); };
const $cv = $('cv'), $stage = $('stage'), $cap = $('caption'), $tag = $('tag'), $err = $('err'), $code = $('code');
const $back = $('bBack'), $play = $('bPlay'), $next = $('bNext'), $reset = $('bReset'), $preset = $('preset'), $speed = $('speed');
const $narration = $('bNarration'), $narrationStatus = $('narrationStatus'), $voice = $('voice');
const speechAvailable = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
const audioAvailable = typeof Audio !== 'undefined' && (function(){
  try {
    const a = new Audio();
    return !!(a.canPlayType && a.canPlayType('audio/mpeg'));
  } catch (e) {
    return false;
  }
})();
const narrationAvailable = speechAvailable || audioAvailable;

function makeAudio(relPath){
  const a = new Audio(relPath);
  a.preload = 'auto';
  return a;
}

const WALKTHROUGHS = {
  duplicate3s: {
    id: 'duplicate3s',
    name: 'Duplicate 3s',
    match: function(cfg){
      return cfg && Array.isArray(cfg.nums) && cfg.nums.length === 6 &&
        cfg.nums.join(',') === '1,3,3,3,5,8' && cfg.target === 3;
    },
    clips: {
      setup: makeAudio('../audio-walkthroughs/leftmost-binary-search/01-setup-and-key-idea.mp3'),
      probe1: makeAudio('../audio-walkthroughs/leftmost-binary-search/02-probe-one-mid-two.mp3'),
      probe2: makeAudio('../audio-walkthroughs/leftmost-binary-search/03-probe-two-mid-zero.mp3'),
      probe3: makeAudio('../audio-walkthroughs/leftmost-binary-search/04-probe-three-mid-one.mp3'),
      finish: makeAudio('../audio-walkthroughs/leftmost-binary-search/05-termination-and-result.mp3')
    },
    mapping: [
      { clip: 'setup',  startIdx: 0, subIdx: 1, splitTime: 18.5 },
      { clip: 'probe1', startIdx: 2, subIdx: 3, splitTime: 9.8 },
      { clip: 'probe2', startIdx: 4, subIdx: 5, splitTime: 9.7 },
      { clip: 'probe3', startIdx: 6, subIdx: 7, splitTime: 9.0 },
      { clip: 'finish', startIdx: 8, subIdx: 9, splitTime: 13.0 }
    ]
  },
  targetMissing4: {
    id: 'targetMissing4',
    name: 'Target missing (4)',
    match: function(cfg){
      return cfg && Array.isArray(cfg.nums) && cfg.nums.length === 4 &&
        cfg.nums.join(',') === '1,3,5,8' && cfg.target === 4;
    },
    clips: {
      setup: makeAudio('../audio-walkthroughs/leftmost-binary-search/target-missing-4/01-setup-and-key-idea.mp3'),
      probe1: makeAudio('../audio-walkthroughs/leftmost-binary-search/target-missing-4/02-probe-one-mid-one.mp3'),
      probe2: makeAudio('../audio-walkthroughs/leftmost-binary-search/target-missing-4/03-probe-two-mid-two.mp3'),
      finish: makeAudio('../audio-walkthroughs/leftmost-binary-search/target-missing-4/04-termination-and-missing-result.mp3')
    },
    mapping: [
      { clip: 'setup',  startIdx: 0, subIdx: 1, splitTime: 16.0 },
      { clip: 'probe1', startIdx: 2, subIdx: 3, splitTime: 9.5 },
      { clip: 'probe2', startIdx: 4, subIdx: 5, splitTime: 9.5 },
      { clip: 'finish', startIdx: 6, subIdx: 7, splitTime: 13.5 }
    ]
  },
  emptyList: {
    id: 'emptyList',
    name: 'Empty list',
    match: function(cfg){
      return cfg && Array.isArray(cfg.nums) && cfg.nums.length === 0;
    },
    clips: {
      setup: makeAudio('../audio-walkthroughs/leftmost-binary-search/empty-list/01-setup-and-key-idea.mp3'),
      finish: makeAudio('../audio-walkthroughs/leftmost-binary-search/empty-list/02-termination-and-result.mp3')
    },
    mapping: [
      { clip: 'setup',  startIdx: 0, subIdx: 1, splitTime: 12.0 },
      { clip: 'finish', startIdx: 2, subIdx: 3, splitTime: 17.5 }
    ]
  },
  allEqual7: {
    id: 'allEqual7',
    name: 'All equal (7 x 5)',
    match: function(cfg){
      return cfg && Array.isArray(cfg.nums) && cfg.nums.length === 5 &&
        cfg.nums.join(',') === '7,7,7,7,7' && cfg.target === 7;
    },
    clips: {
      setup: makeAudio('../audio-walkthroughs/leftmost-binary-search/all-equal-7/01-setup-and-key-idea.mp3'),
      probe1: makeAudio('../audio-walkthroughs/leftmost-binary-search/all-equal-7/02-probe-one-mid-two.mp3'),
      probe2: makeAudio('../audio-walkthroughs/leftmost-binary-search/all-equal-7/03-probe-two-mid-zero.mp3'),
      finish: makeAudio('../audio-walkthroughs/leftmost-binary-search/all-equal-7/04-termination-and-result.mp3')
    },
    mapping: [
      { clip: 'setup',  startIdx: 0, subIdx: 1, splitTime: 19.5 },
      { clip: 'probe1', startIdx: 2, subIdx: 3, splitTime: 13.5 },
      { clip: 'probe2', startIdx: 4, subIdx: 5, splitTime: 14.0 },
      { clip: 'finish', startIdx: 6, subIdx: 7, splitTime: 16.5 }
    ]
  },
  tenItemsFour4s: {
    id: 'tenItemsFour4s',
    name: 'Ten items, four 4s',
    match: function(cfg){
      return cfg && Array.isArray(cfg.nums) && cfg.nums.length === 10 &&
        cfg.nums.join(',') === '1,2,2,4,4,4,4,6,9,11' && cfg.target === 4;
    },
    clips: {
      setup: makeAudio('../audio-walkthroughs/leftmost-binary-search/ten-items-four-4s/01-setup-and-key-idea.mp3'),
      probe1: makeAudio('../audio-walkthroughs/leftmost-binary-search/ten-items-four-4s/02-probe-one-mid-four.mp3'),
      probe2: makeAudio('../audio-walkthroughs/leftmost-binary-search/ten-items-four-4s/03-probe-two-mid-one.mp3'),
      probe3: makeAudio('../audio-walkthroughs/leftmost-binary-search/ten-items-four-4s/04-probe-three-mid-two.mp3'),
      probe4: makeAudio('../audio-walkthroughs/leftmost-binary-search/ten-items-four-4s/05-probe-four-mid-three.mp3'),
      finish: makeAudio('../audio-walkthroughs/leftmost-binary-search/ten-items-four-4s/06-termination-and-result.mp3')
    },
    mapping: [
      { clip: 'setup',  startIdx: 0,  subIdx: 1,  splitTime: 14.0 },
      { clip: 'probe1', startIdx: 2,  subIdx: 3,  splitTime: 13.0 },
      { clip: 'probe2', startIdx: 4,  subIdx: 5,  splitTime: 16.5 },
      { clip: 'probe3', startIdx: 6,  subIdx: 7,  splitTime: 13.5 },
      { clip: 'probe4', startIdx: 8,  subIdx: 9,  splitTime: 11.5 },
      { clip: 'finish', startIdx: 10, subIdx: 11, splitTime: 17.0 }
    ]
  }
};

function getActiveWalkthrough(cfg){
  const keys = Object.keys(WALKTHROUGHS);
  for (let i = 0; i < keys.length; i++){
    const wt = WALKTHROUGHS[keys[i]];
    if (wt.match(cfg)) return wt;
  }
  return null;
}

function narrationStatusMessage(cfg){
  const wt = getActiveWalkthrough(cfg);
  if (wt){
    return 'Narration enabled (using recorded voice walkthrough for ' + wt.name + ').';
  }
  return 'Narration enabled (using browser speech synthesis for custom/other inputs).';
}
let availableVoices = [];
const $customForm = $('customForm'), $customNums = $('customNums'), $customTarget = $('customTarget'), $inputStatus = $('inputStatus');
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches:false };

const rows = CODE.map(function(txt, i){
  const r = document.createElement('div'); r.className = 'row';
  const n = document.createElement('span'); n.className = 'ln'; n.textContent = String(i + 1);
  const c = document.createElement('span'); c.textContent = txt;
  r.appendChild(n); r.appendChild(c); $code.appendChild(r);
  return r;
});
PRESETS.forEach(function(p, i){
  const o = document.createElement('option'); o.value = String(i); o.textContent = p.name; $preset.appendChild(o);
});

/* ---------- three.js scene (perspective 3D) ---------- */
const SP = 1.0, BAR_W = 0.78, BAR_COL = '#3b82c4', RES_COL = '#2e9e5b', RES_DARK = '#16683a';
const LOW_COL = '#2563a8', HIGH_COL = '#c46a14', MID_COL = '#e8a900';
const LOW_Z = 1.2, HIGH_Z = 2.2, FLOOR_Z0 = -0.8, FLOOR_Z1 = 2.9, FOCUS_Z = (FLOOR_Z0 + FLOOR_Z1) / 2;
const YAW0 = -0.22, PITCH0 = 0.46, YAW_MAX = 0.55, FOV = 32;
let gl = false, renderer = null, scene = null, camera = null;
let world = null, bars = [], vals = [], ptr = {}, slab = null, resLabel = null, emptyLabel = null;
let dims = { halfW:7, halfY:3, ty:2, maxTop:3, scale:1 };
const view = { yaw:YAW0, pitch:PITCH0, dist:20 };
const C = {};
const texCache = new Map();
const tweens = [];
let raf = 0, drag = null;

function showError(msg){ $err.hidden = false; $err.textContent = msg; }
function readTheme(){
  const cs = getComputedStyle(document.documentElement);
  ['ink','muted','plate','accent'].forEach(function(k){ C[k] = cs.getPropertyValue('--' + k).trim() || '#888888'; });
}
try {
  if (typeof THREE === 'undefined') throw new Error('three.js did not load');
  renderer = new THREE.WebGLRenderer({ canvas:$cv, antialias:true, alpha:true });
  renderer.setClearColor(0x000000, 0);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, 4 / 3, 0.1, 200);
  scene.add(new THREE.AmbientLight(0xffffff, 0.58));
  const dl = new THREE.DirectionalLight(0xffffff, 0.85); dl.position.set(-5, 10, 8); scene.add(dl);
  gl = true;
} catch (e) {
  showError('The 3D view could not start (' + (e && e.message ? e.message : 'WebGL unavailable') + '). Check your connection or browser WebGL support. The code panel and captions still step through the trace.');
}

function textTex(text, style){
  const key = text + '|' + style.color + '|' + style.font;
  let t = texCache.get(key);
  if (t) return t;
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
  ctx.font = style.font;
  const w = Math.max(24, Math.ceil(ctx.measureText(text).width) + 16), h = 64;
  cv.width = w; cv.height = h;
  ctx.font = style.font; ctx.fillStyle = style.color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, w / 2, h / 2 + 2);
  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  t = { tex:tex, aspect:w / h };
  texCache.set(key, t);
  return t;
}
function clearTexCache(){ texCache.forEach(function(t){ t.tex.dispose(); }); texCache.clear(); }
function makeSprite(){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ transparent:true, depthTest:false }));
  s.renderOrder = 10; s.visible = false; return s;
}
function setText(s, text, style, worldH, x){
  if (!text){ s.visible = false; return; }
  const t = textTex(text, style);
  s.material.map = t.tex; s.material.needsUpdate = true;
  s.scale.set(worldH * t.aspect, worldH, 1);
  if (x !== undefined) s.position.x = x;
  s.visible = true;
}
const SANS = '700 48px system-ui, -apple-system, "Segoe UI", sans-serif';
function slotX(i, n){ return (i - (n - 1) / 2) * SP; }
function barH(v){ return Math.max(v * dims.scale, 0.12); }

function clearWorld(){
  tweens.length = 0;
  if (!world) return;
  world.traverse(function(o){
    if (o.geometry) o.geometry.dispose();
    if (o.material) o.material.dispose();
  });
  scene.remove(world); world = null; bars = []; vals = []; ptr = {}; slab = null; resLabel = null; emptyLabel = null;
}

function makePointer(name, color, up, coneY, labelY, z){
  const g = new THREE.Group();
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 20), new THREE.MeshLambertMaterial({ color:color }));
  cone.position.y = coneY;
  if (!up) cone.rotation.z = Math.PI;
  const lab = makeSprite(); lab.position.y = labelY;
  setText(lab, name, { font:SANS, color:color }, 0.4, 0);
  g.add(cone); g.add(lab); g.position.z = z; g.visible = false;
  return g;
}

function build(cfg, keepView){
  if (!gl) return;
  clearWorld(); readTheme();
  world = new THREE.Group(); scene.add(world);
  const nums = cfg.nums, n = nums.length;
  let maxAbs = 1; nums.forEach(function(v){ maxAbs = Math.max(maxAbs, Math.abs(v)); });
  dims.scale = 3 / maxAbs;
  let maxTop = 0; nums.forEach(function(v){ maxTop = Math.max(maxTop, barH(v)); });
  dims.maxTop = maxTop; dims.halfW = (n + 2) * SP / 2 + 0.7; dims.halfY = (maxTop + 2.6) / 2; dims.ty = (maxTop + 2.2) / 2;

  if (n > 0){
    const floor = new THREE.Mesh(new THREE.BoxGeometry(n * SP + 0.9, 0.14, FLOOR_Z1 - FLOOR_Z0), new THREE.MeshLambertMaterial({ color:C.plate }));
    floor.position.set(0, -0.07, FOCUS_Z); world.add(floor);
  } else {
    emptyLabel = makeSprite(); emptyLabel.position.set(0, 1.0, 0.5); world.add(emptyLabel);
    setText(emptyLabel, 'empty', { font:SANS, color:C.muted }, 0.6, 0);
  }
  nums.forEach(function(v, i){
    const h = barH(v), x = slotX(i, n);
    const body = new THREE.Mesh(new THREE.BoxGeometry(BAR_W, h, BAR_W), new THREE.MeshLambertMaterial({ color:BAR_COL, transparent:true }));
    const outline = new THREE.Mesh(new THREE.BoxGeometry(BAR_W + 0.14, h + 0.14, BAR_W + 0.14), new THREE.MeshBasicMaterial({ color:C.accent, side:THREE.BackSide }));
    body.position.set(x, h / 2, 0); outline.position.set(x, h / 2, 0); outline.visible = false;
    world.add(outline); world.add(body);
    bars.push({ body:body, outline:outline });
    const val = makeSprite(); val.position.set(x, h + 0.32, 0);
    setText(val, String(v), { font:SANS, color:C.ink }, 0.5, x); world.add(val); vals.push(val);
    const idx = makeSprite(); idx.position.set(x, 0.3, 0.98);
    setText(idx, String(i), { font:SANS, color:C.muted }, 0.34, x); world.add(idx);
  });
  ptr.low = makePointer('low', LOW_COL, true, 0.28, 0.95, LOW_Z);
  ptr.high = makePointer('high', HIGH_COL, true, 0.28, 0.95, HIGH_Z);
  ptr.mid = makePointer('mid', MID_COL, false, maxTop + 1.4, maxTop + 2.0, 0);
  [ptr.low, ptr.high, ptr.mid].forEach(function(g){ world.add(g); });
  slab = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color:BAR_COL, transparent:true, opacity:0.12, depthWrite:false }));
  slab.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)), new THREE.LineBasicMaterial({ color:C.accent })));
  slab.visible = false; world.add(slab);
  resLabel = makeSprite(); world.add(resLabel);
  if (!keepView){ view.yaw = YAW0; view.pitch = PITCH0; }
  fitCamera();
}

function updateCamera(){
  if (!gl) return;
  const cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  camera.position.set(Math.sin(view.yaw) * cp * view.dist, dims.ty + sp * view.dist, FOCUS_Z + Math.cos(view.yaw) * cp * view.dist);
  camera.lookAt(0, dims.ty, FOCUS_Z);
  requestRender();
}
function fitCamera(){
  if (!gl) return;
  const w = $stage.clientWidth, h = $stage.clientHeight;
  if (!w || !h) return;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  const aspect = w / h, t = Math.tan(FOV * Math.PI / 360), halfZ = (FLOOR_Z1 - FLOOR_Z0) / 2;
  camera.aspect = aspect; camera.updateProjectionMatrix();
  const vExt = dims.halfY * Math.cos(PITCH0) + halfZ * Math.sin(PITCH0);
  const hExt = dims.halfW * Math.cos(YAW_MAX) + halfZ * Math.sin(YAW_MAX);
  view.dist = Math.max(vExt / t, hExt / (t * aspect)) * 1.2;
  updateCamera();
}

/* ---------- tweens and render loop ---------- */
function settle(){ tweens.splice(0).forEach(function(tw){ tw.upd(1); }); }
function requestRender(){ if (gl && !raf) raf = requestAnimationFrame(loop); }
function loop(){
  raf = 0;
  const now = performance.now();
  for (let i = tweens.length - 1; i >= 0; i--){
    const tw = tweens[i];
    const u = Math.max(0, Math.min(1, (now - tw.t0) / tw.dur));
    tw.upd(u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
    if (u >= 1) tweens.splice(i, 1);
  }
  renderer.render(scene, camera);
  if (tweens.length) requestRender();
}

/* drag left or right to turn the scene; double-click resets the view */
if (gl){
  $cv.addEventListener('pointerdown', function(e){
    drag = { x:e.clientX, yaw:view.yaw };
    try { $cv.setPointerCapture(e.pointerId); } catch (err) { /* not needed for the drag to work */ }
  });
  $cv.addEventListener('pointermove', function(e){
    if (!drag) return;
    view.yaw = Math.max(-YAW_MAX, Math.min(YAW_MAX, drag.yaw + (e.clientX - drag.x) * 0.008));
    updateCamera();
  });
  ['pointerup', 'pointercancel'].forEach(function(t){ $cv.addEventListener(t, function(){ drag = null; }); });
  $cv.addEventListener('dblclick', function(){ view.yaw = YAW0; view.pitch = PITCH0; updateCamera(); });
}

const S = { cfg:PRESETS[0], frames:[], idx:0, state:'paused', timer:0, speed:1300, shown:-1, narration:false, narrationPending:false, narrationToken:0, voiceURI:'auto', currentClip:null, subTimer:0 };

function tweenDur(f){ return S.state === 'playing' ? Math.max(120, Math.min(600, S.speed * f.hold * 0.5)) : 450; }
function easeProp(get, set, to, animate, f){
  const from = get();
  if (animate && !RM.matches && Math.abs(from - to) > 1e-6){
    tweens.push({ t0:performance.now(), dur:tweenDur(f), upd:function(e){ set(from + (to - from) * e); } });
  } else {
    set(to);
  }
}
function applyScene(f, animate){
  if (!gl || !world) return;
  const n = S.cfg.nums.length;
  const wasVisible = { low:ptr.low.visible, high:ptr.high.visible, mid:ptr.mid.visible };
  const same = f.low !== null && f.low === f.high;
  [['low', f.low, same ? -0.23 : 0], ['high', f.high, same ? 0.23 : 0], ['mid', f.mid, 0]].forEach(function(p){
    const g = ptr[p[0]];
    if (p[1] === null){ g.visible = false; return; }
    const x = slotX(p[1], n) + p[2];
    if (!wasVisible[p[0]]) g.position.x = x;
    g.visible = true;
    easeProp(function(){ return g.position.x; }, function(v){ g.position.x = v; }, x, animate && wasVisible[p[0]], f);
  });
  const showSlab = f.low !== null && f.low <= f.high && n > 0;
  if (showSlab){
    const x0 = slotX(f.low, n), x1 = slotX(f.high, n), cx = (x0 + x1) / 2, w = (f.high - f.low + 1) * SP + 0.08;
    const y0 = -0.05, y1 = dims.maxTop + 0.55;
    const was = slab.visible;
    slab.visible = true; slab.scale.y = y1 - y0; slab.scale.z = 1.5; slab.position.y = (y0 + y1) / 2;
    if (!was){ slab.position.x = cx; slab.scale.x = w; }
    easeProp(function(){ return slab.position.x; }, function(v){ slab.position.x = v; }, cx, animate && was, f);
    easeProp(function(){ return slab.scale.x; }, function(v){ slab.scale.x = v; }, w, animate && was, f);
  } else {
    slab.visible = false;
  }
  bars.forEach(function(b, i){
    const alive = f.low === null || (i >= f.low && i <= f.high);
    const isMid = f.mid === i, isRes = f.result === i;
    const a = (alive || isMid || isRes) ? 1 : 0.25;
    b.body.material.opacity = a; vals[i].material.opacity = a;
    b.body.material.color.set(isRes ? RES_COL : BAR_COL);
    b.body.material.emissive.set(isMid ? '#5a4300' : '#000000');
    b.outline.visible = isMid || isRes;
    b.outline.material.color.set(isMid ? C.accent : RES_DARK);
  });
  if (f.result >= 0){
    resLabel.position.set(slotX(f.result, n), barH(S.cfg.nums[f.result]) + 0.9, 0);
    setText(resLabel, 'result', { font:SANS, color:RES_COL }, 0.38, slotX(f.result, n));
  } else {
    resLabel.visible = false;
  }
  requestRender();
}

function renderCode(f){
  let firstActive = -1;
  rows.forEach(function(r, i){
    const a = f.lines.indexOf(i) >= 0;
    r.classList.toggle('active', a);
    if (a && firstActive < 0) firstActive = i;
  });
  if (firstActive >= 0){
    const r = rows[firstActive];
    if (r.offsetTop < $code.scrollTop) $code.scrollTop = r.offsetTop;
    else if (r.offsetTop + r.offsetHeight > $code.scrollTop + $code.clientHeight) $code.scrollTop = r.offsetTop + r.offsetHeight - $code.clientHeight;
  }
}
function describe(f){
  const nums = S.cfg.nums;
  return 'List [' + nums.join(', ') + '], target ' + f.target + '. ' +
    (f.low === null ? 'Search not started.' : 'low ' + f.low + ', high ' + f.high + (f.mid !== null ? ', mid ' + f.mid : '') + '.') +
    ' Comparisons ' + f.comps + '. Result ' + f.result + '.';
}
function updateButtons(){
  const last = S.frames.length - 1;
  $back.disabled = S.idx <= 0;
  $next.disabled = S.idx >= last;
  $play.textContent = S.state === 'playing' ? 'Pause' : (S.idx >= last ? 'Replay' : 'Play');
  $narration.textContent = 'Narration: ' + (S.narration ? 'On' : 'Off');
  $narration.setAttribute('aria-pressed', String(S.narration));
}

function tutorNarration(frame){
  if (frame.kind === 'start'){
    return 'Key idea for leftmost binary search: on a match, keep the candidate index but search left. The leftmost match can only be at or before it.';
  }
  if (frame.kind === 'init'){
    return 'Initialize low at index 0 and high at index ' + frame.high + '. Comparisons are 0 and result is negative 1, meaning no match found yet.';
  }
  if (frame.kind === 'pick'){
    return 'Low is ' + frame.low + ' and high is ' + frame.high + '. Inspect the midpoint at index ' + frame.mid + '.';
  }
  if (frame.kind === 'step'){
    if (frame.cmp === 'eq'){
      return 'The item matches target ' + frame.target + '! Record result = ' + frame.result + ', and search left by setting high = ' + frame.high + '.';
    }
    if (frame.cmp === 'lt'){
      return 'The item is smaller than target ' + frame.target + '. Discard the left half by setting low = ' + frame.low + '.';
    }
    if (frame.cmp === 'gt'){
      return 'The item is larger than target ' + frame.target + '. Discard the right half by setting high = ' + frame.high + '.';
    }
    return 'Low ' + frame.low + ' is now greater than high ' + frame.high + '. The search interval is empty, so the loop finishes.';
  }
  if (frame.kind === 'end'){
    if (frame.result >= 0){
      return 'Return tuple (' + frame.result + ', ' + frame.comps + '): the leftmost match is at index ' + frame.result + ' in ' + frame.comps + ' comparisons.';
    }
    return 'Return tuple (-1, ' + frame.comps + '): target ' + frame.target + ' was not found in ' + frame.comps + ' comparisons.';
  }
  return frame.msg;
}

function voiceScore(voice){
  const name = voice.name.toLowerCase(), lang = voice.lang.toLowerCase();
  let score = lang.indexOf('en') === 0 ? 100 : -100;
  if (/\b(natural|neural|enhanced|premium)\b/.test(name)) score += 80;
  if (/\b(online|cloud)\b/.test(name)) score += 20;
  if (lang === 'en-us') score += 5;
  return score;
}
function preferredVoice(){
  const english = availableVoices.filter(function(voice){ return voice.lang.toLowerCase().indexOf('en') === 0; });
  english.sort(function(a, b){ return voiceScore(b) - voiceScore(a) || a.name.localeCompare(b.name); });
  return english[0] || availableVoices.find(function(voice){ return voice.default; }) || null;
}
function refreshVoices(){
  if (!speechAvailable) return;
  const selected = S.voiceURI || $voice.value || 'auto';
  availableVoices = window.speechSynthesis.getVoices();
  $voice.replaceChildren();
  const automatic = document.createElement('option');
  automatic.value = 'auto';
  automatic.textContent = 'Automatic (prefer natural English)';
  $voice.appendChild(automatic);
  availableVoices.slice().sort(function(a, b){
    return voiceScore(b) - voiceScore(a) || a.name.localeCompare(b.name);
  }).forEach(function(voice){
    const option = document.createElement('option');
    option.value = voice.voiceURI;
    option.textContent = voice.name + ' (' + voice.lang + ')' + (voiceScore(voice) >= 180 ? ' \u00b7 natural' : '');
    $voice.appendChild(option);
  });
  $voice.value = Array.from($voice.options).some(function(option){ return option.value === selected; }) ? selected : 'auto';
  S.voiceURI = $voice.value;
}

function cancelNarration(){
  const wasPending = S.narrationPending;
  S.narrationToken += 1;
  S.narrationPending = false;
  S.currentClip = null;
  if (S.subTimer){ clearTimeout(S.subTimer); S.subTimer = 0; }
  Object.keys(WALKTHROUGHS).forEach(function(key){
    const clips = WALKTHROUGHS[key].clips;
    Object.keys(clips).forEach(function(k){
      const c = clips[k];
      c.pause();
      c.currentTime = 0;
      c.onended = null;
      c.onerror = null;
    });
  });
  if (speechAvailable && wasPending){
    try { window.speechSynthesis.cancel(); } catch(e){}
  }
}

function speakTutor(frame, token, finish){
  if (!speechAvailable){
    S.narrationPending = false;
    $narrationStatus.textContent = 'Browser speech is unavailable; captions still guide each step.';
    if (S.state === 'playing') schedule();
    return;
  }
  const utterance = new SpeechSynthesisUtterance(tutorNarration(frame));
  utterance.lang = document.documentElement.lang || 'en';
  utterance.rate = S.speed >= 1100 ? 0.85 : S.speed >= 700 ? 1 : S.speed >= 400 ? 1.25 : 1.4;
  utterance.voice = S.voiceURI === 'auto'
    ? preferredVoice()
    : availableVoices.find(function(voice){ return voice.voiceURI === S.voiceURI; }) || null;
  utterance.onend = finish;
  utterance.onerror = finish;
  try {
    window.speechSynthesis.speak(utterance);
  } catch (e) {
    if (token !== S.narrationToken) return;
    S.narrationPending = false;
    $narrationStatus.textContent = 'Browser speech could not be started.';
    if (S.state === 'playing') schedule();
  }
}

function speakFrame(frame){
  const wt = getActiveWalkthrough(S.cfg);
  let milestone = null;
  if (wt){
    milestone = wt.mapping.find(function(m){ return S.idx === m.startIdx || S.idx === m.subIdx; });
  }

  const expectedClip = (wt && milestone) ? wt.clips[milestone.clip] : null;
  if (expectedClip && S.currentClip === expectedClip && !expectedClip.paused && !expectedClip.ended){
    return;
  }

  cancelNarration();
  if (!S.narration || !narrationAvailable) return;

  const token = S.narrationToken;
  const finish = function(){
    if (token !== S.narrationToken) return;
    S.narrationPending = false;
    S.currentClip = null;
    if (S.state === 'playing'){
      if (S.idx >= S.frames.length - 1){
        S.state = 'ended';
        updateButtons();
      } else {
        schedule();
      }
    }
  };
  S.narrationPending = true;

  if (wt && audioAvailable && milestone){
    const clip = wt.clips[milestone.clip];
    S.currentClip = clip;
    let fellBack = false;
    const fallback = function(){
      if (fellBack || token !== S.narrationToken) return;
      fellBack = true;
      clip.onended = null;
      clip.onerror = null;
      S.currentClip = null;
      $narrationStatus.textContent = 'A recorded narration clip could not play; using browser speech instead.';
      speakTutor(frame, token, finish);
    };

    clip.onended = finish;
    clip.onerror = fallback;

    const isSub = (S.idx === milestone.subIdx);
    const startTime = isSub ? milestone.splitTime : 0;
    try { clip.currentTime = startTime; } catch(e){}

    if (S.idx === milestone.startIdx && S.state === 'playing'){
      const remainingToSub = Math.max(0, milestone.splitTime - startTime);
      S.subTimer = setTimeout(function(){
        if (token === S.narrationToken && S.state === 'playing' && S.idx === milestone.startIdx){
          show(milestone.subIdx, true);
        }
      }, remainingToSub * 1000);
    }

    const playPromise = clip.play();
    if (playPromise !== undefined){
      playPromise.catch(function(err){
        if (err && err.name === 'NotAllowedError'){
          $narrationStatus.textContent = 'Audio playback was blocked by browser autoplay policy. Click Play or Next to enable sound.';
          fallback();
        } else {
          fallback();
        }
      });
    }
  } else {
    speakTutor(frame, token, finish);
  }
}

function show(i, animate){
  const f = S.frames[i]; if (!f) return;
  settle();
  S.idx = i;
  $cap.textContent = f.msg;
  $tag.textContent = (S.cfg.nums.length === 0 ? 'empty list \u00b7 ' : '') + 'target ' + f.target + ' \u00b7 comparisons ' + f.comps;
  $cv.setAttribute('aria-label', describe(f));
  renderCode(f);
  applyScene(f, animate && Math.abs(i - S.shown) === 1);
  speakFrame(f);
  S.shown = i;
  updateButtons();
}

function clearTimer(){ if (S.timer){ clearTimeout(S.timer); S.timer = 0; } }
function schedule(){

  S.timer = setTimeout(tick, S.speed * S.frames[S.idx].hold);
}
function tick(){
  S.timer = 0;

  if (S.idx >= S.frames.length - 1){ S.state = 'ended'; updateButtons(); return; }

}
function pause(){
  clearTimer();

    S.currentClip.pause();
  } else {
    cancelNarration();
  }

}
function play(){

  if (S.narration){
    const wt = getActiveWalkthrough(S.cfg);
    if (wt && S.currentClip && S.currentClip.paused && !S.currentClip.ended){
      const token = S.narrationToken;
      const milestone = wt.mapping.find(function(m){ return S.idx === m.startIdx || S.idx === m.subIdx; });
      if (milestone && S.idx === milestone.startIdx && S.currentClip.currentTime < milestone.splitTime){
        const remainingToSub = Math.max(0, milestone.splitTime - S.currentClip.currentTime);
        S.subTimer = setTimeout(function(){
          if (token === S.narrationToken && S.state === 'playing' && S.idx === milestone.startIdx){
            show(milestone.subIdx, true);
          }
        }, remainingToSub * 1000);
      }
      S.narrationPending = true;

    }

function step(d){

  show(j, true);
}
function reset(){
  cancelNarration();
  pause();
  show(0, false);
}
function loadConfig(cfg){
  cancelNarration();
  pause();
  S.cfg = cfg;
  $customNums.value = cfg.nums.join(', ');
  $customTarget.value = String(cfg.target);
  S.frames = simulate(S.cfg).frames; S.shown = -1; S.idx = 0;
  build(S.cfg);

    $narrationStatus.textContent = narrationStatusMessage(cfg);
  }
}
function loadPreset(i){

}

function toggleNarration(){
  S.narration = !S.narration;
  if (!S.narration){
    cancelNarration();
    $narrationStatus.textContent = 'Narration muted.';
    if (S.state === 'playing') schedule();
  } else {
    $narrationStatus.textContent = narrationStatusMessage(S.cfg);
    speakFrame(S.frames[S.idx]);
  }
  updateButtons();
}

$back.addEventListener('click', function(){ step(-1); });
$next.addEventListener('click', function(){ step(1); });
$play.addEventListener('click', play);
$reset.addEventListener('click', reset);
$narration.addEventListener('click', toggleNarration);
$voice.addEventListener('change', function(){
  S.voiceURI = $voice.value;
  if (S.narration && !getActiveWalkthrough(S.cfg)) speakFrame(S.frames[S.idx]);
});
$preset.addEventListener('change', function(){ loadPreset(Number($preset.value)); });
$customForm.addEventListener('submit', function(e){
  e.preventDefault();

  if (raw !== '' && raw.split(',').some(function(value){ return value.trim() === ''; })){
    $inputStatus.textContent = 'Separate whole numbers with commas; remove any empty entries.'; $customNums.focus(); return;
  }
  const nums = raw === '' ? [] : raw.split(',').map(function(value){ return Number(value.trim()); });
  const target = Number($customTarget.value);
  if (nums.length > 16){ $inputStatus.textContent = 'Use no more than 16 numbers.'; $customNums.focus(); return; }
  if (nums.some(function(value){ return !Number.isSafeInteger(value) || value < -1000 || value > 1000; })){
    $inputStatus.textContent = 'Every list item must be a whole number from −1,000 to 1,000.'; $customNums.focus(); return;
  }
  if (nums.some(function(value, i){ return i > 0 && value < nums[i - 1]; })){
    $inputStatus.textContent = 'The list must be sorted in non-decreasing order.'; $customNums.focus(); return;
  }
  if (!Number.isSafeInteger(target) || target < -1000 || target > 1000){
    $inputStatus.textContent = 'Target must be a whole number from −1,000 to 1,000.'; $customTarget.focus(); return;
  }
  $inputStatus.textContent = 'Running your input: [' + nums.join(', ') + '], target ' + target + '.';
  loadConfig({ name:'Your input', nums:nums, target:target });
});
$speed.addEventListener('change', function(){
  S.speed = Number($speed.value);
  if (S.state === 'playing') schedule();
});
document.addEventListener('keydown', function(e){
  const t = e.target && e.target.tagName;

  if (e.key === ' '){ e.preventDefault(); play(); }

if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fitCamera).observe($stage);
else window.addEventListener('resize', fitCamera);

function retheme(){
  if (!gl) return;
  clearTexCache(); readTheme(); build(S.cfg, true); S.shown = -1; show(S.idx, false);
}
try {
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
} catch (e) { /* older browsers: theme refresh on reload */ }

  refreshVoices();
  if (window.speechSynthesis.onvoiceschanged !== undefined){
    window.speechSynthesis.onvoiceschanged = refreshVoices;
  }
}

loadPreset(0);
})();
</script>
